# Vagrant Development Inventory
#
# This inventory mirrors the Vagrantfile configuration.
# For production, create a separate inventory with real host IPs.
#
---
all:
  children:
    proxy:
      hosts:
        proxy:
          ansible_host: 192.168.56.10
          ansible_user: vagrant
          ansible_ssh_private_key_file: .vagrant/machines/proxy/virtualbox/private_key

    mta:
      hosts:
        mta-1:
          ansible_host: 192.168.56.11
          ansible_user: vagrant
          ansible_ssh_private_key_file: .vagrant/machines/mta-1/virtualbox/private_key
          mta_node_index: 1

        mta-2:
          ansible_host: 192.168.56.12
          ansible_user: vagrant
          ansible_ssh_private_key_file: .vagrant/machines/mta-2/virtualbox/private_key
          mta_node_index: 2

        mta-3:
          ansible_host: 192.168.56.13
          ansible_user: vagrant
          ansible_ssh_private_key_file: .vagrant/machines/mta-3/virtualbox/private_key
          mta_node_index: 3
