# Helsinki MTA Node Variables
#
# Configuration specific to MTA nodes running KumoMTA, TSA, Redis, and KumoProxy.
#
---
# geerlingguy.redis configuration
# Bind to localhost only (no vSwitch needed)
redis_bind_interface: "127.0.0.1"
redis_port: 6379
redis_databases: 16
redis_maxmemory: "512mb"
redis_maxmemory_policy: "allkeys-lru"

# KumoMTA configuration
kumomta_start_services: false
kumomta_enable_services: false
mta_hostname: "mail.kbmta.net"

# TSA configuration
tsa_redis_url: "redis://{{ redis_host }}:{{ redis_port }}"

# =============================================================================
# KumoProxy Configuration
# =============================================================================
# Proxy runs on same server as MTA (localhost)
kumoproxy_listen_ip: "127.0.0.1"
kumoproxy_listen_port: 5000

# =============================================================================
# OpenTelemetry Collector Configuration
# =============================================================================
# SigNoz endpoint for telemetry export (HTTPS with full URL for otlphttp exporter)
otel_signoz_endpoint: "https://ingest.monitor.kibamail.com"
otel_signoz_insecure: false

# Service identification
otel_service_name: "kumomta"
otel_environment: "production"

# Systemd units to collect logs from via journald
otel_collector_journald_units:
  - "kumomta"
  - "kumo-tsa-daemon"

# =============================================================================
# Monitoring Stack Configuration
# =============================================================================
monitoring_domain: monitor.kbmta.net
certbot_email: frantz@kibamail.com
grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"

# Prometheus
monitoring_prometheus_bind: "127.0.0.1"
monitoring_prometheus_port: 9090
monitoring_prometheus_retention: "30d"
monitoring_prometheus_scrape_interval: "15s"
monitoring_kumomta_scrape_interval: "5s"
monitoring_kumomta_metrics_host: "127.0.0.1:8000"
monitoring_node_exporter_port: 9100

# Loki
monitoring_loki_bind: "127.0.0.1"
monitoring_loki_port: 3100
monitoring_loki_retention: "720h"
monitoring_loki_storage_path: "/var/lib/loki"

# Promtail
monitoring_promtail_bind: "127.0.0.1"
monitoring_promtail_port: 9080
monitoring_kumomta_log_path: "/var/log/kumomta-plain/kumomta.log"

# Log Pipe
monitoring_log_pipe_tailer_bin: "/opt/kumomta/sbin/tailer"
monitoring_log_pipe_source: "/var/log/kumomta"
monitoring_log_pipe_dest_dir: "/var/log/kumomta-plain"
monitoring_log_pipe_dest_file: "/var/log/kumomta-plain/kumomta.log"
monitoring_log_pipe_rotate_count: 7
monitoring_log_pipe_rotate_size: "100M"

# Grafana
monitoring_grafana_bind: "127.0.0.1"
monitoring_grafana_port: 3000
monitoring_grafana_root_url: "https://monitor.kbmta.net"
monitoring_grafana_admin_user: "admin"
