# Site Playbook - Full Cluster Provisioning
#
# This playbook provisions the entire cluster.
#
# Usage:
#   ansible-playbook playbooks/site.yml -e mta_cluster=helsinki
#
# Required environment variables:
#   CLOUDFLARE_API_TOKEN - Cloudflare API token for DNS-01 challenge
#   INJECTION_SECRET_KEY - Secret key for HTTP injection authentication
#
---
- name: Provision all machines with common setup
  hosts: all
  become: yes
  roles:
    - role: common
      tags: [common]
    - role: geerlingguy.security
      tags: [security]

- name: Import MTA provisioning
  ansible.builtin.import_playbook: provision-mta.yml
