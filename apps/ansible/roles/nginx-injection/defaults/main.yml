# nginx-injection Role Defaults
---
# Domain for the injection proxy
nginx_injection_domain: "inject.kbmta.net"

# Header name for authentication
nginx_injection_secret_header: "X-Kibamail-Injection-Key"

# Email for Let's Encrypt certificates
nginx_tls_cert_email: "engineering@kibamail.com"

# Cloudflare API token environment variable name
cloudflare_api_token_env: "CLOUDFLARE_API_TOKEN"

# KumoMTA HTTP injection port (upstream)
kumomta_http_port: 8000
