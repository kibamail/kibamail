# tracking Role - Application Deployment
#
# Creates tracking user, clones repository, installs dependencies,
# builds the application, and configures PM2 for process management.
#
---
- name: Create tracking system user
  ansible.builtin.user:
    name: "{{ tracking_user }}"
    system: yes
    shell: /bin/bash
    home: "/home/{{ tracking_user }}"
    create_home: yes

- name: Create application directory
  ansible.builtin.file:
    path: "{{ tracking_app_dir }}"
    state: directory
    owner: "{{ tracking_user }}"
    group: "{{ tracking_user }}"
    mode: "0755"

- name: Clone repository
  ansible.builtin.git:
    repo: "{{ tracking_repo }}"
    dest: "{{ tracking_app_dir }}"
    version: "{{ tracking_branch }}"
    force: yes
  become_user: "{{ tracking_user }}"
  register: git_clone

- name: Install dependencies
  ansible.builtin.command: pnpm install --frozen-lockfile
  args:
    chdir: "{{ tracking_app_dir }}"
  become_user: "{{ tracking_user }}"
  when: git_clone.changed
  register: pnpm_install

- name: Build tracking application
  ansible.builtin.command: pnpm --filter @repo/tracking build
  args:
    chdir: "{{ tracking_app_dir }}"
  become_user: "{{ tracking_user }}"
  when: git_clone.changed or pnpm_install.changed
  register: pnpm_build

- name: Deploy environment file
  ansible.builtin.template:
    src: tracking.env.j2
    dest: "{{ tracking_app_dir }}/apps/tracking/.env"
    owner: "{{ tracking_user }}"
    group: "{{ tracking_user }}"
    mode: "0600"
  notify: Restart PM2 tracking

- name: Deploy PM2 ecosystem config
  ansible.builtin.template:
    src: tracking.ecosystem.config.js.j2
    dest: "{{ tracking_app_dir }}/ecosystem.config.js"
    owner: "{{ tracking_user }}"
    group: "{{ tracking_user }}"
    mode: "0644"
  notify: Restart PM2 tracking

- name: Check if PM2 process is running
  ansible.builtin.command: pm2 describe tracking
  become_user: "{{ tracking_user }}"
  register: pm2_status
  changed_when: false
  failed_when: false

- name: Start application with PM2
  ansible.builtin.command: pm2 start ecosystem.config.js
  args:
    chdir: "{{ tracking_app_dir }}"
  become_user: "{{ tracking_user }}"
  when: pm2_status.rc != 0

- name: Save PM2 process list
  ansible.builtin.command: pm2 save
  become_user: "{{ tracking_user }}"
  changed_when: false

- name: Setup PM2 startup script
  ansible.builtin.command: pm2 startup systemd -u {{ tracking_user }} --hp /home/{{ tracking_user }}
  register: pm2_startup
  changed_when: "'already' not in pm2_startup.stdout"

- name: Execute PM2 startup command
  ansible.builtin.shell: "{{ pm2_startup.stdout_lines[-1] }}"
  when: pm2_startup.changed and pm2_startup.stdout_lines | length > 0
  failed_when: false
