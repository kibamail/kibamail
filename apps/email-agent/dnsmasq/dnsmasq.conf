# DNS override for email-agent integration tests
# Routes ALL mail server domains to mailpit for testing

# Forward Docker internal domains to Docker's DNS resolver
server=/docker.internal/127.0.0.11

# Override ALL A/AAAA record lookups to point to mailpit
address=/#/172.28.0.10

# Explicit MX records for test domains (dnsmasq doesn't support wildcard MX)
# These override the null MX that example.com returns from upstream
mx-host=example.com,mail.local,10
mx-host=test.com,mail.local,10
mx-host=kibamail.com,mail.local,10
mx-host=gmail.com,mail.local,10

# Upstream DNS for other queries
server=8.8.8.8
server=8.8.4.4

# Log all DNS queries for debugging
log-queries
