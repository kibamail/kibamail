services:
  postgres:
    image: postgres:18-alpine
    container_name: control-plane-kibaship-postgres
    restart: unless-stopped
    env_file: .env.local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - control-plane-kibaship-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: control-plane-kibaship-rabbitmq
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 1s
      timeout: 1s
      retries: 30
    networks:
      - control-plane-kibaship-network

  logto:
    container_name: control-plane-kibaship-logto
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 3001:3001
      - 3002:3002
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    image: svhd/logto:latest
    environment:
      - TRUST_PROXY_HEADER=1
      - DB_URL=postgresql://postgres:postgres@postgres:5432/logto
      - ENDPOINT
      - ADMIN_ENDPOINT
    networks:
      - control-plane-kibaship-network

  outpost-api:
    image: hookdeck/outpost:v0.7.0
    container_name: control-plane-kibaship-outpost-api
    env_file: .env.local
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./webhooks/config/outpost:/config/outpost
    environment:
      SERVICE: api
      POSTGRES_URL: postgres://outpost:outpost@postgres:5432/outpost?sslmode=disable
      RABBITMQ_SERVER_URL: amqp://guest:guest@rabbitmq:5672
      API_KEY: "${OUTPOST_API_KEY}"
      API_JWT_SECRET: "${OUTPOST_API_JWT_SECRET}"
      AES_ENCRYPTION_SECRET: "${OUTPOST_AES_ENCRYPTION_SECRET}"
      REDIS_HOST: "${OUTPOST_REDIS_HOST}"
      REDIS_PORT: "${OUTPOST_REDIS_PORT}"
      REDIS_PASSWORD: "${OUTPOST_REDIS_PASSWORD}"
      REDIS_DATABASE: "${OUTPOST_REDIS_DATABASE}"
    ports:
      - "3333:3333"
    networks:
      - control-plane-kibaship-network

  outpost-delivery:
    image: hookdeck/outpost:v0.7.0
    container_name: control-plane-kibaship-outpost-delivery
    env_file: .env.local
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./webhooks/config/outpost:/config/outpost
    environment:
      SERVICE: delivery
      POSTGRES_URL: postgres://outpost:outpost@postgres:5432/outpost?sslmode=disable
      RABBITMQ_SERVER_URL: amqp://guest:guest@rabbitmq:5672
      API_KEY: "${OUTPOST_API_KEY}"
      API_JWT_SECRET: "${OUTPOST_API_JWT_SECRET}"
      AES_ENCRYPTION_SECRET: "${OUTPOST_AES_ENCRYPTION_SECRET}"
      REDIS_HOST: "${OUTPOST_REDIS_HOST}"
      REDIS_PORT: "${OUTPOST_REDIS_PORT}"
      REDIS_PASSWORD: "${OUTPOST_REDIS_PASSWORD}"
      REDIS_DATABASE: "${OUTPOST_REDIS_DATABASE}"
    networks:
      - control-plane-kibaship-network

  outpost-log:
    image: hookdeck/outpost:v0.7.0
    container_name: control-plane-kibaship-outpost-log
    env_file: .env.local
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./webhooks/config/outpost:/config/outpost
    environment:
      SERVICE: log
      POSTGRES_URL: postgres://outpost:outpost@postgres:5432/outpost?sslmode=disable
      RABBITMQ_SERVER_URL: amqp://guest:guest@rabbitmq:5672
      API_KEY: "${OUTPOST_API_KEY}"
      API_JWT_SECRET: "${OUTPOST_API_JWT_SECRET}"
      AES_ENCRYPTION_SECRET: "${OUTPOST_AES_ENCRYPTION_SECRET}"
      REDIS_HOST: "${OUTPOST_REDIS_HOST}"
      REDIS_PORT: "${OUTPOST_REDIS_PORT}"
      REDIS_PASSWORD: "${OUTPOST_REDIS_PASSWORD}"
      REDIS_DATABASE: "${OUTPOST_REDIS_DATABASE}"
    networks:
      - control-plane-kibaship-network

  redis:
    image: redis:7.4-alpine
    container_name: control-plane-kibaship-redis
    restart: always
    env_file: .env.local
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command: >
      redis-server
        --save 20 1
        --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - control-plane-kibaship-network

  nats:
    image: nats:2.10-alpine
    container_name: control-plane-kibaship-nats
    restart: unless-stopped
    ports:
      - "4222:4222" # Client connections
      - "8222:8222" # HTTP monitoring
    volumes:
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./docker/nats/certs:/etc/nats/certs:ro
      - nats_data:/data/jetstream
    command: ["-c", "/etc/nats/nats-server.conf"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - control-plane-kibaship-network

  nats-init:
    image: natsio/nats-box:0.14.3
    container_name: control-plane-kibaship-nats-init
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./docker/nats/init-streams.sh:/init-streams.sh:ro
      - ./docker/nats/certs:/etc/nats/certs:ro
    environment:
      NATS_URL: "tls://nats:4222"
      NATS_USER: "admin"
      NATS_PASSWORD: "admin_dev_password"
      NATS_CA: "/etc/nats/certs/ca.pem"
    entrypoint: ["/bin/sh", "/init-streams.sh"]
    networks:
      - control-plane-kibaship-network

volumes:
  postgres_data:
    driver: local
  nats_data:
    driver: local

networks:
  control-plane-kibaship-network:
    driver: bridge
