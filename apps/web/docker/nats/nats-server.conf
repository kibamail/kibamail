# NATS Server Configuration for Development
# Mirrors production setup with TLS and JetStream

server_name: nats-dev

# Client connections
port: 4222
host: 0.0.0.0

# HTTP monitoring
http_port: 8222

# Maximum payload size (1MB)
max_payload: 1048576

# Logging
debug: false
trace: false
logtime: true

# TLS Configuration
# Server presents certificate, client verifies it (one-way TLS)
# Authentication is via username/password, not client certificates
tls {
  cert_file: "/etc/nats/certs/server.pem"
  key_file: "/etc/nats/certs/server-key.pem"
  ca_file: "/etc/nats/certs/ca.pem"
  verify: false
  timeout: 2
}

# JetStream Configuration
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 5GB
}

# Authorization - simplified for development
authorization {
  users = [
    # Admin user for CLI and management
    {
      user: "admin"
      password: "admin_dev_password"
      permissions: {
        publish: ">"
        subscribe: ">"
      }
    },
    # Control plane user for email injection and event consumption
    # Note: kibamail.events.> publish permission is for testing only
    # In production, only email_agent publishes to kibamail.events.>
    {
      user: "control_plane"
      password: "control_plane_dev_password"
      permissions: {
        publish: {
          allow: [
            "kibamail.commands.>",
            "kibamail.emails.>",
            "kibamail.events.>",
            "$JS.API.>"
          ]
        }
        subscribe: {
          allow: [
            "kibamail.agent.>",
            "kibamail.events.>",
            "_INBOX.>",
            "$JS.API.>",
            "$JS.ACK.>"
          ]
        }
      }
    },
    # Email agent user for consuming emails
    {
      user: "email_agent"
      password: "email_agent_dev_password"
      permissions: {
        publish: {
          allow: [
            "kibamail.agent.>",
            "kibamail.events.>",
            "$JS.API.>"
          ]
        }
        subscribe: {
          allow: [
            "kibamail.commands.>",
            "kibamail.emails.>",
            "_INBOX.>",
            "$JS.API.>",
            "$JS.ACK.>"
          ]
        }
      }
    }
  ]
}
