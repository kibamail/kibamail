# =============================================================================
# DNSMasq Configuration for KumoMTA Integration Testing
# =============================================================================
#
# This configuration intercepts ALL MX lookups and routes them to mailpit.
# This allows testing real email delivery without actually sending to the internet.
#
# =============================================================================

# Don't read /etc/resolv.conf or /etc/hosts
no-resolv
no-hosts

# Log queries for debugging
log-queries
log-facility=-

# Listen on all interfaces
interface=*
bind-interfaces

# Upstream DNS for external queries (Google DNS)
server=8.8.8.8
server=8.8.4.4

# =============================================================================
# Infrastructure A Records
# =============================================================================

# KumoMTA
address=/mail.kbmta.net/172.30.0.10
address=/mta.kbmta.net/172.30.0.10

# DMARC reporting endpoint
address=/dmarc.kbmta.net/172.30.0.10

# Control Plane Mock
address=/control-plane.kbmta.net/172.30.0.4

# Mailpit (catches all email)
address=/smtp.test.local/172.30.0.5
address=/mailpit.test.local/172.30.0.5

# SOCKS5 Proxies - Marketing
address=/proxy-mktg-1.kbmta.net/172.30.0.41
address=/proxy-mktg-2.kbmta.net/172.30.0.42
address=/proxy-mktg-3.kbmta.net/172.30.0.43

# SOCKS5 Proxies - Transactional
address=/proxy-trx-1.kbmta.net/172.30.0.51
address=/proxy-trx-2.kbmta.net/172.30.0.52
address=/proxy-trx-3.kbmta.net/172.30.0.53

# =============================================================================
# Test Domain A Records
# =============================================================================

# Primary test domain (verified in control plane)
address=/picoklos.kibamail.xyz/172.30.0.10
address=/kb.picoklos.kibamail.xyz/172.30.0.10

# Other test sending domains
address=/hq.kibamail.xyz/172.30.0.10
address=/kb.hq.kibamail.xyz/172.30.0.10
address=/testcustomer.com/172.30.0.10
address=/kb.testcustomer.com/172.30.0.10

# =============================================================================
# MX Records - Route ALL email to Mailpit
# =============================================================================

# The magic: wildcard MX that catches EVERYTHING
mx-host=#,smtp.test.local,10

# Specific popular domains (for logging clarity)
mx-host=gmail.com,smtp.test.local,10
mx-host=yahoo.com,smtp.test.local,10
mx-host=outlook.com,smtp.test.local,10
mx-host=hotmail.com,smtp.test.local,10
mx-host=icloud.com,smtp.test.local,10
mx-host=example.com,smtp.test.local,10
mx-host=test.com,smtp.test.local,10

# Resolve MX hostnames to mailpit
address=/gmail.com/172.30.0.5
address=/yahoo.com/172.30.0.5
address=/outlook.com/172.30.0.5
address=/hotmail.com/172.30.0.5
address=/icloud.com/172.30.0.5
address=/example.com/172.30.0.5
address=/test.com/172.30.0.5

# Google's real MX hostnames -> mailpit
address=/gmail-smtp-in.l.google.com/172.30.0.5
address=/alt1.gmail-smtp-in.l.google.com/172.30.0.5
address=/alt2.gmail-smtp-in.l.google.com/172.30.0.5

# =============================================================================
# Customer Bounce Domain MX Records
# =============================================================================

# Route bounce domain traffic to KumoMTA
mx-host=kb.picoklos.kibamail.xyz,mail.kbmta.net,10
mx-host=kb.hq.kibamail.xyz,mail.kbmta.net,10
mx-host=kb.testcustomer.com,mail.kbmta.net,10

# DMARC reports go to KumoMTA
mx-host=dmarc.kbmta.net,mail.kbmta.net,10

# =============================================================================
# TXT Records (SPF, DKIM, DMARC)
# =============================================================================

# SPF records
txt-record=hq.kibamail.xyz,"v=spf1 ip4:172.30.0.10 include:_spf.kbmta.net -all"
txt-record=testcustomer.com,"v=spf1 ip4:172.30.0.10 include:_spf.kbmta.net -all"
txt-record=_spf.kbmta.net,"v=spf1 ip4:172.30.0.10 -all"

# DMARC records
txt-record=_dmarc.hq.kibamail.xyz,"v=DMARC1; p=none; rua=mailto:re+test@dmarc.kbmta.net"
txt-record=_dmarc.testcustomer.com,"v=DMARC1; p=none; rua=mailto:re+test@dmarc.kbmta.net"

# DKIM selector records (placeholder - actual public keys would go here)
txt-record=kibamail._domainkey.hq.kibamail.xyz,"v=DKIM1; k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC/test/public/key=="
txt-record=kibamail._domainkey.testcustomer.com,"v=DKIM1; k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC/test/public/key=="
txt-record=kbmta._domainkey.kbmta.net,"v=DKIM1; k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC/mta/public/key=="

# =============================================================================
# PTR Records (Reverse DNS)
# =============================================================================

ptr-record=10.0.30.172.in-addr.arpa,mail.kbmta.net
ptr-record=41.0.30.172.in-addr.arpa,mktg-mta-1.kbmta.net
ptr-record=42.0.30.172.in-addr.arpa,mktg-mta-2.kbmta.net
ptr-record=43.0.30.172.in-addr.arpa,mktg-mta-3.kbmta.net
ptr-record=51.0.30.172.in-addr.arpa,trx-mta-1.kbmta.net
ptr-record=52.0.30.172.in-addr.arpa,trx-mta-2.kbmta.net
ptr-record=53.0.30.172.in-addr.arpa,trx-mta-3.kbmta.net
