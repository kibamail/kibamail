# Docker Compose for CI testing
# Simplified configuration with hardcoded values (no env_file dependencies)

services:
  postgres:
    image: postgres:18-alpine
    container_name: ci-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"
    volumes:
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: ci-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: ci-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./docker/nats/certs:/etc/nats/certs:ro
    command: ["-c", "/etc/nats/nats-server.conf"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats-init:
    image: natsio/nats-box:0.14.3
    container_name: ci-nats-init
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./docker/nats/init-streams.sh:/init-streams.sh:ro
      - ./docker/nats/certs:/etc/nats/certs:ro
    environment:
      NATS_URL: "tls://nats:4222"
      NATS_USER: "admin"
      NATS_PASSWORD: "admin_dev_password"
      NATS_CA: "/etc/nats/certs/ca.pem"
    entrypoint: ["/bin/sh", "/init-streams.sh"]
