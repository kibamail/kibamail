# =============================================================================
# Kibamail Egress Source Configuration - STAGING ENVIRONMENT
# =============================================================================
#
# Staging environment mirrors production but with staging proxy/IPs.
# Update these values to match your staging infrastructure.
#
# =============================================================================

# =============================================================================
# EGRESS SOURCES
# =============================================================================

[source."staging-mta-1"]
socks5_proxy_server = "proxy.staging.kbmta.net:5000"
socks5_proxy_source_address = "10.0.0.10"
ehlo_domain = "staging-mta-1.kbmta.net"

# =============================================================================
# EGRESS POOLS
# =============================================================================

# -----------------------------------------------------------------------------
# Marketing Pool
# -----------------------------------------------------------------------------

[pool."marketing"]

[pool."marketing"."staging-mta-1"]
weight = 1

# -----------------------------------------------------------------------------
# Default Pool
# -----------------------------------------------------------------------------

[pool."default"]

[pool."default"."staging-mta-1"]
weight = 1
