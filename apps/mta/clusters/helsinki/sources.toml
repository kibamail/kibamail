# =============================================================================
# Kibamail Egress Source Configuration - Helsinki (EU-NORTH-1)
# =============================================================================
#
# Production cluster for Europe (Finland - Hetzner Helsinki)
#
# Marketing IP Range: 37.27.167.40/29
#   - Network address: 37.27.167.40 (unusable)
#   - Usable hosts: 37.27.167.41 - 37.27.167.46 (6 IPs)
#   - Broadcast address: 37.27.167.47 (unusable)
#
# Transactional IP Range: 135.181.10.0/29
#   - Network address: 135.181.10.0 (unusable)
#   - Usable hosts: 135.181.10.1 - 135.181.10.6 (6 IPs)
#   - Broadcast address: 135.181.10.7 (unusable)
#
# All traffic is routed through the SOCKS5 proxy server at 10.0.0.2:5000 (vSwitch)
# The proxy server holds the public IPs and initiates outbound connections.
#
# =============================================================================

# =============================================================================
# EGRESS SOURCES
# =============================================================================
#
# Each source defines:
#   - socks5_proxy_server: The proxy server that handles outbound connections
#   - socks5_proxy_source_address: The IP the proxy binds to for this source
#   - ehlo_domain: The EHLO hostname (must have forward + reverse DNS)
#
# DNS requirements (configured on proxy server IPs):
#   - Forward DNS (A record): ehlo_domain -> socks5_proxy_source_address
#   - Reverse DNS (PTR record): socks5_proxy_source_address -> ehlo_domain

# -----------------------------------------------------------------------------
# Active Sources (currently in pools)
# -----------------------------------------------------------------------------

[source."mktg-mta-5"]
socks5_proxy_server = "10.0.0.2:5000"
socks5_proxy_source_address = "37.27.167.45"
ehlo_domain = "mktg-mta-5.kbmta.net"

[source."mktg-mta-6"]
socks5_proxy_server = "10.0.0.2:5000"
socks5_proxy_source_address = "37.27.167.46"
ehlo_domain = "mktg-mta-6.kbmta.net"

# -----------------------------------------------------------------------------
# Reserved Sources (not currently in pools)
# -----------------------------------------------------------------------------
# These IPs have matching A and PTR records configured:
#   37.27.167.41 <-> mktg-mta-1.kbmta.net
#   37.27.167.42 <-> mktg-mta-2.kbmta.net
#   37.27.167.43 <-> mktg-mta-3.kbmta.net
#   37.27.167.44 <-> mktg-mta-4.kbmta.net
#

[source."mktg-mta-1"]
socks5_proxy_server = "10.0.0.2:5000"
socks5_proxy_source_address = "37.27.167.41"
ehlo_domain = "mktg-mta-1.kbmta.net"

[source."mktg-mta-2"]
socks5_proxy_server = "10.0.0.2:5000"
socks5_proxy_source_address = "37.27.167.42"
ehlo_domain = "mktg-mta-2.kbmta.net"

[source."mktg-mta-3"]
socks5_proxy_server = "10.0.0.2:5000"
socks5_proxy_source_address = "37.27.167.43"
ehlo_domain = "mktg-mta-3.kbmta.net"

[source."mktg-mta-4"]
socks5_proxy_server = "10.0.0.2:5000"
socks5_proxy_source_address = "37.27.167.44"
ehlo_domain = "mktg-mta-4.kbmta.net"

# =============================================================================
# EGRESS POOLS
# =============================================================================
#
# Pools group sources together for load distribution.
# Messages are assigned to pools, not individual sources.
# Distribution within a pool uses weighted round-robin.

# -----------------------------------------------------------------------------
# Marketing Pool - All campaign and marketing emails
# -----------------------------------------------------------------------------

[pool."marketing"]

[pool."marketing"."mktg-mta-5"]
weight = 1


# -----------------------------------------------------------------------------
# Default Pool - Fallback pool when no specific pool is assigned
# -----------------------------------------------------------------------------

[pool."default"]

[pool."default"."mktg-mta-5"]
weight = 1

