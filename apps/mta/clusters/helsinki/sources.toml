# =============================================================================
# EGRESS POOLS
# =============================================================================
#
# Pools group sources together for load distribution.
# Messages are assigned to pools, not individual sources.
# Distribution within a pool uses weighted round-robin.

# -----------------------------------------------------------------------------
# Marketing Pool - All campaign and marketing emails
# -----------------------------------------------------------------------------

[pool."marketing"]

[pool."marketing"."mktg-mta-7"]
weight = 1

# -----------------------------------------------------------------------------
# Default Pool - Fallback pool when no specific pool is assigned
# -----------------------------------------------------------------------------

[pool."default"]

[pool."default"."mktg-mta-7"]
weight = 1

# -----------------------------------------------------------------------------
# Transactional Pool - All transactional emails (password resets, receipts, etc.)
# -----------------------------------------------------------------------------

[pool."transactional"]

[pool."transactional"."trx-mta-1"]
weight = 1
