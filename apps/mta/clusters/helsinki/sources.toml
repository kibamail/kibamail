# =============================================================================
# Kibamail Egress Source Configuration - Helsinki (EU-NORTH-1)
# =============================================================================
#
# Production cluster for Europe (Hostkey)
#
# Transactional IP Range: 157.254.187.2 - 157.254.187.8 (7 IPs)
# Marketing IP Range: 157.254.187.128 - 157.254.187.134 (7 IPs)
#
# All traffic is routed through the SOCKS5 proxy server at 127.0.0.1:5000 (localhost)
# The proxy server runs on the same machine and holds the public IPs.
#
# =============================================================================

# =============================================================================
# EGRESS SOURCES
# =============================================================================
#
# Each source defines:
#   - socks5_proxy_server: The proxy server that handles outbound connections
#   - socks5_proxy_source_address: The IP the proxy binds to for this source
#   - ehlo_domain: The EHLO hostname (must have forward + reverse DNS)
#
# DNS requirements (configured on proxy server IPs):
#   - Forward DNS (A record): ehlo_domain -> socks5_proxy_source_address
#   - Reverse DNS (PTR record): socks5_proxy_source_address -> ehlo_domain

# =============================================================================
# TRANSACTIONAL EGRESS SOURCES
# =============================================================================

[source."trx-mta-1"]
socks5_proxy_server = "127.0.0.1:5000"
socks5_proxy_source_address = "157.254.187.2"
ehlo_domain = "trx-mta-1.kbmta.net"

