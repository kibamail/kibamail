# =============================================================================
# Kibamail Egress Source Configuration
# =============================================================================
#
# This file is the source of truth for all sending IP addresses and pools.
# Update this file when adding, removing, or modifying sending IPs.
#
# All traffic is routed through the SOCKS5 proxy server at proxy.kbmta.net:5000
# The proxy server holds the public IPs and initiates outbound connections.
#
# =============================================================================

# =============================================================================
# EGRESS SOURCES
# =============================================================================
#
# Each source defines:
#   - socks5_proxy_server: The proxy server that handles outbound connections
#   - socks5_proxy_source_address: The IP the proxy binds to for this source
#   - ehlo_domain: The EHLO hostname (must have forward + reverse DNS)
#
# DNS requirements (configured on proxy server IPs):
#   - Forward DNS (A record): ehlo_domain -> socks5_proxy_source_address
#   - Reverse DNS (PTR record): socks5_proxy_source_address -> ehlo_domain
#

[source."mktg-mta-1"]
socks5_proxy_server = "proxy.kbmta.net:5000"
socks5_proxy_source_address = "192.0.2.10"
ehlo_domain = "mktg-mta-1.kbmta.net"

[source."mktg-mta-2"]
socks5_proxy_server = "proxy.kbmta.net:5000"
socks5_proxy_source_address = "192.0.2.11"
ehlo_domain = "mktg-mta-2.kbmta.net"

# =============================================================================
# EGRESS POOLS
# =============================================================================
#
# Pools group sources together for load distribution.
# Messages are assigned to pools, not individual sources.
# Distribution within a pool uses weighted round-robin.
#

# -----------------------------------------------------------------------------
# Marketing Pool (Primary)
# -----------------------------------------------------------------------------
# All campaign and marketing emails use this pool.
# Both IPs have equal weight (1:1) for balanced distribution.

[pool."marketing"]

[pool."marketing"."mktg-mta-1"]
weight = 1

[pool."marketing"."mktg-mta-2"]
weight = 1

# -----------------------------------------------------------------------------
# Default Pool
# -----------------------------------------------------------------------------
# Fallback pool when no specific pool is assigned.

[pool."default"]

[pool."default"."mktg-mta-1"]
weight = 1

[pool."default"."mktg-mta-2"]
weight = 1
