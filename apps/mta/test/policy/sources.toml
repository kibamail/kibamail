# =============================================================================
# Kibamail Egress Source Configuration - TEST ENVIRONMENT
# =============================================================================
#
# Test environment uses a single source through the local SOCKS5 proxy
# which routes all traffic to mailpit for inspection.
#
# Network: kumoproxy (172.28.0.6:1080) → dnsmasq → mailpit
#
# =============================================================================

# =============================================================================
# EGRESS SOURCES
# =============================================================================

[source."test-source-1"]
socks5_proxy_server = "172.28.0.6:1080"
socks5_proxy_source_address = "172.28.0.6"
ehlo_domain = "mail.kbmta.net"

# =============================================================================
# EGRESS POOLS
# =============================================================================

# -----------------------------------------------------------------------------
# Marketing Pool
# -----------------------------------------------------------------------------

[pool."marketing"]

[pool."marketing"."test-source-1"]
weight = 1

# -----------------------------------------------------------------------------
# Default Pool
# -----------------------------------------------------------------------------

[pool."default"]

[pool."default"."test-source-1"]
weight = 1
