# =============================================================================
# DNSmasq Configuration for KumoMTA Integration Testing
# =============================================================================
#
# This configuration provides:
# - Custom A records for test infrastructure
# - MX records that route all email to mailpit
# - Wildcard domains for customer bounce domains
#
# =============================================================================

# Don't read /etc/resolv.conf or /etc/hosts
no-resolv
no-hosts

# Log queries for debugging
log-queries
log-facility=-

# Listen on all interfaces
interface=*
bind-interfaces

# Upstream DNS for external queries (Google DNS)
server=8.8.8.8
server=8.8.4.4

# =============================================================================
# Infrastructure A Records
# =============================================================================

# KumoMTA
address=/mail.kbmta.net/172.28.0.3
address=/mta.kbmta.net/172.28.0.3

# DMARC reporting endpoint (also KumoMTA)
address=/dmarc.kbmta.net/172.28.0.3

# Email Agent
address=/email-agent.kbmta.net/172.28.0.4

# Test SMTP Server (catches all outbound email with STARTTLS support)
address=/smtp.test.local/172.28.0.5

# SOCKS5 Proxy
address=/proxy.kbmta.net/172.28.0.6

# Control Plane Mock
address=/control-plane.kbmta.net/172.28.0.10

# =============================================================================
# Test Domain A Records
# =============================================================================

# Customer sending domain (for testing)
address=/hq.kibamail.xyz/172.28.0.3
address=/kb.hq.kibamail.xyz/172.28.0.3

# Another test customer domain
address=/testcustomer.com/172.28.0.3
address=/kb.testcustomer.com/172.28.0.3

# =============================================================================
# MX Records - Route ALL email to Mailpit
# =============================================================================

# Gmail
mx-host=gmail.com,smtp.test.local,10
address=/gmail.com/172.28.0.5
address=/gmail-smtp-in.l.google.com/172.28.0.5
address=/alt1.gmail-smtp-in.l.google.com/172.28.0.5

# Yahoo
mx-host=yahoo.com,smtp.test.local,10
address=/yahoo.com/172.28.0.5
address=/mta5.am0.yahoodns.net/172.28.0.5

# Microsoft/Outlook
mx-host=outlook.com,smtp.test.local,10
mx-host=hotmail.com,smtp.test.local,10
mx-host=live.com,smtp.test.local,10
address=/outlook.com/172.28.0.5
address=/hotmail.com/172.28.0.5
address=/live.com/172.28.0.5

# Apple
mx-host=icloud.com,smtp.test.local,10
mx-host=me.com,smtp.test.local,10
address=/icloud.com/172.28.0.5
address=/me.com/172.28.0.5

# Generic test domains
mx-host=example.com,smtp.test.local,10
mx-host=test.com,smtp.test.local,10
mx-host=recipient.test,smtp.test.local,10
address=/example.com/172.28.0.5
address=/test.com/172.28.0.5
address=/recipient.test/172.28.0.5

# =============================================================================
# Wildcard MX - Catch all other domains
# =============================================================================

# Default MX for any domain not explicitly configured
# This ensures ALL outbound email goes to test SMTP server
mx-host=#,smtp.test.local,10

# =============================================================================
# Customer Bounce Domain MX Records (kb.* pattern)
# =============================================================================

# Route bounce domain traffic to KumoMTA (for OOB/ARF handling)
mx-host=kb.hq.kibamail.xyz,mail.kbmta.net,10
mx-host=kb.testcustomer.com,mail.kbmta.net,10

# =============================================================================
# DMARC Reporting MX
# =============================================================================

# DMARC reports go to KumoMTA for processing
mx-host=dmarc.kbmta.net,mail.kbmta.net,10

# =============================================================================
# TXT Records (for DKIM, SPF, DMARC lookups)
# =============================================================================

# SPF record for test domain
txt-record=hq.kibamail.xyz,"v=spf1 ip4:172.28.0.3 include:_spf.kbmta.net -all"
txt-record=testcustomer.com,"v=spf1 ip4:172.28.0.3 include:_spf.kbmta.net -all"
txt-record=_spf.kbmta.net,"v=spf1 ip4:172.28.0.3 -all"

# DMARC records for test domains
txt-record=_dmarc.hq.kibamail.xyz,"v=DMARC1; p=none; rua=mailto:re+test@dmarc.kbmta.net"
txt-record=_dmarc.testcustomer.com,"v=DMARC1; p=none; rua=mailto:re+test@dmarc.kbmta.net"

# DKIM selector records (public keys - generated by certificate script)
# These will be populated by the test setup
txt-record=kibamail._domainkey.hq.kibamail.xyz,"v=DKIM1; k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC/test/public/key=="
txt-record=kibamail._domainkey.testcustomer.com,"v=DKIM1; k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC/test/public/key=="

# MTA DKIM selector
txt-record=kbmta._domainkey.kbmta.net,"v=DKIM1; k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC/mta/public/key=="

# =============================================================================
# PTR Records (Reverse DNS)
# =============================================================================

# Reverse DNS for KumoMTA
ptr-record=3.0.28.172.in-addr.arpa,mail.kbmta.net
