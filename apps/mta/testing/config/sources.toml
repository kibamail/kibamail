# =============================================================================
# Kibamail Egress Source Configuration - TEST
# =============================================================================
#
# Local testing environment with Docker infrastructure
#
# Network: kumoproxy (172.28.0.6:1080) -> dnsmasq -> smtp-server
#
# =============================================================================

# =============================================================================
# EGRESS SOURCES
# =============================================================================

[source."test-source-1"]
socks5_proxy_server = "172.28.0.6:1080"
socks5_proxy_source_address = "172.28.0.6"
ehlo_domain = "mail.kbmta.net"

# =============================================================================
# EGRESS POOLS
# =============================================================================

# Marketing Pool - Marketing pool for tests
[pool."marketing"]

[pool."marketing"."test-source-1"]
weight = 1

# Default Pool - Default pool for tests
[pool."default"]

[pool."default"."test-source-1"]
weight = 1
