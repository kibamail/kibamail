# =============================================================================
# Kibamail MTA DKIM Signing Configuration
# =============================================================================
#
# This file configures DKIM signing for the MTA's own domain (kbmta.net).
# This is the second signature in the 2-fold DKIM signing strategy.
#
# Tenant DKIM signing is handled separately via the Email Agent API.
#
# =============================================================================

# =============================================================================
# BASE CONFIGURATION
# =============================================================================
#
# Default settings applied to all domains unless overridden.
#

[base]
# Enable over-signing to prevent header injection attacks
over_sign = true

# Default selector for all domains
selector = "kbmta"

# Headers to sign (RFC 6376 recommended set)
headers = [
  "From",
  "To",
  "Subject",
  "Date",
  "Message-ID",
  "Reply-To",
  "Cc",
  "Content-Type",
  "MIME-Version",
  "Sender",
]

# =============================================================================
# MTA SIGNING DOMAIN
# =============================================================================
#
# The MTA signs all outbound messages with its own DKIM key.
# This provides an additional layer of authentication beyond tenant signing.
#

[domain."kbmta.net"]
selector = "kbmta"
algo = "sha256"

# Key file path (generated by scripts/generate-dkim.sh)
# Default: /opt/kumomta/etc/dkim/DOMAIN/SELECTOR.key
filename = "/opt/kumomta/etc/dkim/kbmta.net/kbmta.key"

# Policy: Always - always sign messages from this domain
policy = "Always"
