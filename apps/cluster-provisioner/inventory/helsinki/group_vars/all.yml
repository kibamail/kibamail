# Helsinki Cluster-wide Variables
#
# Production MTA cluster at Hostkey
#
---
# Cluster identification
cluster_name: "helsinki"
cluster_id: "helsinki-prod"
cluster_region: "eu-north-1"

# =============================================================================
# Proxy Configuration
# =============================================================================
# Proxy runs on same server as MTA (localhost)
proxy_host: "127.0.0.1"
proxy_socks5_port: 5000

# =============================================================================
# Redis Configuration
# =============================================================================
# Redis runs locally on the MTA server
redis_host: "127.0.0.1"
redis_port: 6379

# =============================================================================
# Nginx Injection Proxy Configuration
# =============================================================================
nginx_injection_domain: "inject.kbmta.net"
nginx_injection_secret_header: "X-Kibamail-Injection-Key"
cloudflare_api_token_env: "CLOUDFLARE_API_TOKEN"

# geerlingguy.security role configuration
security_ssh_port: 22
security_ssh_password_authentication: "no"
security_ssh_permit_root_login: "yes"
security_autoupdate_enabled: false
security_fail2ban_enabled: true

# Common packages to install
common_packages:
  - curl
  - wget
  - vim
  - htop
  - net-tools
  - jq
  - unzip
