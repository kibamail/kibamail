# Site Playbook - Full Cluster Provisioning
#
# This playbook provisions the entire cluster:
# - Proxy machine
# - MTA nodes (to be added)
#
# Usage:
#   ansible-playbook playbooks/site.yml
#
---
- name: Provision all machines with common setup
  hosts: all
  become: yes
  roles:
    - role: common
      tags: [common]
    - role: geerlingguy.security
      tags: [security]

- name: Provision proxy machine
  hosts: proxy
  become: yes
  roles:
    - role: proxy
      tags: [proxy]

