# Configure MTA Node
#
# This playbook configures KumoMTA on a provisioned MTA node:
# - Generates DKIM keys if they don't exist
# - Copies policy files (init.lua, tsa_init.lua)
# - Copies DKIM configuration (dkim_data.toml)
# - Copies cluster-specific sources configuration (sources.toml)
# - Creates KumoMTA environment file with required variables
#
# Prerequisites:
# - MTA node must be provisioned with provision-mta.yml first
# - KumoMTA must be installed
# - Email Agent must be deployed and running
#
# Usage:
#   ansible-playbook playbooks/configure-mta.yml -e mta_cluster=helsinki
#
# Variables:
#   mta_cluster: The cluster name (e.g., helsinki) - REQUIRED
#   dkim_domain: The domain for DKIM signing (default: kbmta.net)
#   dkim_selector: The DKIM selector (default: kbmta)
#   mta_hostname: FQDN for SMTP EHLO/banner (set in inventory)
#
---
- name: Configure MTA Node
  hosts: mta
  become: yes

  vars:
    # Path to MTA configuration files (relative to playbook)
    mta_config_path: "{{ playbook_dir }}/../../mta"

    # KumoMTA policy directory on target
    kumomta_policy_dir: "/opt/kumomta/etc/policy"

    # DKIM configuration
    dkim_domain: "kbmta.net"
    dkim_selector: "kbmta"
    dkim_key_size: 2048
    dkim_base_dir: "/opt/kumomta/etc/dkim"
    dkim_credentials_dir: "{{ inventory_dir }}/credentials/dkim"

    # KumoMTA environment configuration
    kumomta_env_file: "/opt/kumomta/etc/kumod.env"
    kumomta_control_plane_url: "{{ lookup('env', 'CONTROL_PLANE_URL') }}"
    kumomta_internal_service_key: "{{ lookup('env', 'INTERNAL_SERVICE_KEY') }}"
    kumomta_webhook_url: "{{ lookup('env', 'WEBHOOK_URL') }}"
    kumomta_mta_hostname: "{{ mta_hostname }}"
    kumomta_trusted_hosts: "127.0.0.1,::1,10.0.0.0/8"

  pre_tasks:
    - name: Validate mta_cluster is defined
      ansible.builtin.fail:
        msg: "mta_cluster variable is required. Use: -e mta_cluster=helsinki"
      when: mta_cluster is not defined

    - name: Validate CONTROL_PLANE_URL is set
      ansible.builtin.fail:
        msg: "CONTROL_PLANE_URL environment variable is required"
      when: kumomta_control_plane_url | length == 0

    - name: Validate INTERNAL_SERVICE_KEY is set
      ansible.builtin.fail:
        msg: "INTERNAL_SERVICE_KEY environment variable is required"
      when: kumomta_internal_service_key | length == 0

    - name: Validate WEBHOOK_URL is set
      ansible.builtin.fail:
        msg: "WEBHOOK_URL environment variable is required"
      when: kumomta_webhook_url | length == 0

    - name: Verify cluster sources.toml exists
      ansible.builtin.stat:
        path: "{{ mta_config_path }}/clusters/{{ mta_cluster }}/sources.toml"
      delegate_to: localhost
      become: no
      register: sources_file

    - name: Fail if cluster sources.toml not found
      ansible.builtin.fail:
        msg: "Cluster config not found: {{ mta_config_path }}/clusters/{{ mta_cluster }}/sources.toml"
      when: not sources_file.stat.exists

    - name: Display configuration info
      ansible.builtin.debug:
        msg: |
          Configuring MTA node: {{ inventory_hostname }}
          - Host: {{ ansible_host }}
          - Cluster: {{ mta_cluster }}
          - Policy directory: {{ kumomta_policy_dir }}

  tasks:
    # =========================================================================
    # DKIM Key Generation
    # =========================================================================

    - name: Ensure local DKIM credentials directory exists
      ansible.builtin.file:
        path: "{{ dkim_credentials_dir }}/{{ dkim_domain }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: no

    - name: Check if DKIM private key exists locally
      ansible.builtin.stat:
        path: "{{ dkim_credentials_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.key"
      delegate_to: localhost
      become: no
      register: local_dkim_key

    - name: Check if DKIM private key exists on server
      ansible.builtin.stat:
        path: "{{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.key"
      register: server_dkim_key

    - name: Create DKIM directory on server
      ansible.builtin.file:
        path: "{{ dkim_base_dir }}/{{ dkim_domain }}"
        state: directory
        owner: kumod
        group: kumod
        mode: "0750"
      when: not server_dkim_key.stat.exists and not local_dkim_key.stat.exists

    - name: Generate DKIM private key on server
      ansible.builtin.command:
        cmd: openssl genrsa -f4 -out "{{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.key" {{ dkim_key_size }}
        creates: "{{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.key"
      when: not server_dkim_key.stat.exists and not local_dkim_key.stat.exists
      register: dkim_key_generated

    - name: Extract DKIM public key on server
      ansible.builtin.command:
        cmd: openssl rsa -in "{{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.key" -outform PEM -pubout -out "{{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.pub"
        creates: "{{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.pub"
      when: dkim_key_generated.changed | default(false)

    - name: Set DKIM key permissions on server
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: kumod
        group: kumod
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.key", mode: "0600" }
        - { path: "{{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.pub", mode: "0644" }
      when: dkim_key_generated.changed | default(false)

    - name: Fetch DKIM private key to local credentials
      ansible.builtin.fetch:
        src: "{{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.key"
        dest: "{{ dkim_credentials_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.key"
        flat: yes
      when: dkim_key_generated.changed | default(false)

    - name: Fetch DKIM public key to local credentials
      ansible.builtin.fetch:
        src: "{{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.pub"
        dest: "{{ dkim_credentials_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.pub"
        flat: yes
      when: dkim_key_generated.changed | default(false)

    - name: Set local DKIM key permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ dkim_credentials_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.key", mode: "0600" }
        - { path: "{{ dkim_credentials_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.pub", mode: "0644" }
      delegate_to: localhost
      become: no
      when: dkim_key_generated.changed | default(false)

    # If keys exist locally but not on server, copy them to server
    - name: Create DKIM directory on server (from local keys)
      ansible.builtin.file:
        path: "{{ dkim_base_dir }}/{{ dkim_domain }}"
        state: directory
        owner: kumod
        group: kumod
        mode: "0750"
      when: local_dkim_key.stat.exists and not server_dkim_key.stat.exists

    - name: Copy DKIM private key from local to server
      ansible.builtin.copy:
        src: "{{ dkim_credentials_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.key"
        dest: "{{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.key"
        owner: kumod
        group: kumod
        mode: "0600"
      when: local_dkim_key.stat.exists and not server_dkim_key.stat.exists

    - name: Copy DKIM public key from local to server
      ansible.builtin.copy:
        src: "{{ dkim_credentials_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.pub"
        dest: "{{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.pub"
        owner: kumod
        group: kumod
        mode: "0644"
      when: local_dkim_key.stat.exists and not server_dkim_key.stat.exists

    # Read public key for DNS record output
    - name: Read DKIM public key for DNS record
      ansible.builtin.slurp:
        src: "{{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.pub"
      register: dkim_public_key_content

    - name: Extract DKIM public key data
      ansible.builtin.set_fact:
        dkim_public_key_data: "{{ dkim_public_key_content.content | b64decode | regex_replace('-----BEGIN PUBLIC KEY-----', '') | regex_replace('-----END PUBLIC KEY-----', '') | regex_replace('\\n', '') | trim }}"

    # =========================================================================
    # KumoMTA Policy Configuration
    # =========================================================================

    # Ensure policy directory exists
    - name: Ensure KumoMTA policy directory exists
      ansible.builtin.file:
        path: "{{ kumomta_policy_dir }}"
        state: directory
        owner: kumod
        group: kumod
        mode: "0755"

    # Copy policy files
    - name: Copy init.lua policy file
      ansible.builtin.copy:
        src: "{{ mta_config_path }}/kumomta/policy/init.lua"
        dest: "{{ kumomta_policy_dir }}/init.lua"
        owner: kumod
        group: kumod
        mode: "0644"
      notify: restart kumomta

    - name: Copy tsa_init.lua policy file
      ansible.builtin.copy:
        src: "{{ mta_config_path }}/kumomta/policy/tsa_init.lua"
        dest: "{{ kumomta_policy_dir }}/tsa_init.lua"
        owner: kumod
        group: kumod
        mode: "0644"
      notify: restart tsa

    # Copy DKIM configuration
    - name: Copy DKIM configuration
      ansible.builtin.copy:
        src: "{{ mta_config_path }}/kumomta/dkim/dkim_data.toml"
        dest: "{{ kumomta_policy_dir }}/dkim_data.toml"
        owner: kumod
        group: kumod
        mode: "0644"
      notify: restart kumomta

    # Copy shaping configuration
    - name: Copy shaping configuration
      ansible.builtin.copy:
        src: "{{ mta_config_path }}/kumomta/policy/shaping.toml"
        dest: "{{ kumomta_policy_dir }}/shaping.toml"
        owner: kumod
        group: kumod
        mode: "0644"
      notify: restart kumomta

    # Copy cluster-specific sources configuration
    - name: Copy cluster sources configuration
      ansible.builtin.copy:
        src: "{{ mta_config_path }}/clusters/{{ mta_cluster }}/sources.toml"
        dest: "{{ kumomta_policy_dir }}/sources.toml"
        owner: kumod
        group: kumod
        mode: "0644"
      notify: restart kumomta

    # =========================================================================
    # KumoMTA Environment Configuration
    # =========================================================================

    - name: Create KumoMTA environment file
      ansible.builtin.copy:
        content: |
          # KumoMTA Environment Configuration
          # Generated by Ansible - DO NOT EDIT MANUALLY
          #
          # These variables are required by the init.lua policy file

          # Control Plane API URL (for DKIM lookups, auth validation, domain validation)
          CONTROL_PLANE_URL={{ kumomta_control_plane_url }}

          # Internal service key for authenticating to Control Plane
          INTERNAL_SERVICE_KEY={{ kumomta_internal_service_key }}

          # Webhook URL for delivery events (bounces, deliveries, etc.)
          WEBHOOK_URL={{ kumomta_webhook_url }}

          # MTA hostname for SMTP banner and headers
          MTA_HOSTNAME={{ kumomta_mta_hostname }}

          # Trusted hosts for HTTP API access (comma-separated)
          TRUSTED_HOSTS={{ kumomta_trusted_hosts }}
        dest: "{{ kumomta_env_file }}"
        owner: kumod
        group: kumod
        mode: "0640"
      notify: restart kumomta

    # =========================================================================
    # TLS Certificate (Let's Encrypt via Cloudflare DNS)
    # =========================================================================

    - name: Check if TLS certificate already exists
      ansible.builtin.stat:
        path: /opt/kumomta/etc/tls/fullchain.pem
      register: tls_cert_exists

    - name: Validate CLOUDFLARE_API_TOKEN environment variable
      ansible.builtin.fail:
        msg: "CLOUDFLARE_API_TOKEN environment variable is required for TLS certificate issuance"
      when:
        - not tls_cert_exists.stat.exists
        - lookup('env', 'CLOUDFLARE_API_TOKEN') == ''

    - name: Install certbot and Cloudflare plugin
      ansible.builtin.apt:
        name:
          - certbot
          - python3-certbot-dns-cloudflare
        state: present
        update_cache: yes
      when: not tls_cert_exists.stat.exists

    - name: Create certbot credentials directory
      ansible.builtin.file:
        path: /etc/letsencrypt/cloudflare
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: not tls_cert_exists.stat.exists

    - name: Create Cloudflare credentials file
      ansible.builtin.copy:
        content: |
          dns_cloudflare_api_token = {{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}
        dest: /etc/letsencrypt/cloudflare/credentials.ini
        owner: root
        group: root
        mode: "0600"
      when: not tls_cert_exists.stat.exists

    - name: Obtain TLS certificate from Let's Encrypt via Cloudflare DNS
      ansible.builtin.command:
        cmd: >
          certbot certonly
          --dns-cloudflare
          --dns-cloudflare-credentials /etc/letsencrypt/cloudflare/credentials.ini
          --dns-cloudflare-propagation-seconds 30
          --non-interactive
          --agree-tos
          --email admin@kibamail.com
          -d {{ mta_hostname }}
      when: not tls_cert_exists.stat.exists
      register: certbot_result

    - name: Create KumoMTA TLS directory
      ansible.builtin.file:
        path: /opt/kumomta/etc/tls
        state: directory
        owner: kumod
        group: kumod
        mode: "0750"
      when: certbot_result.changed | default(false)

    - name: Copy TLS certificate to KumoMTA
      ansible.builtin.copy:
        src: /etc/letsencrypt/live/{{ mta_hostname }}/fullchain.pem
        dest: /opt/kumomta/etc/tls/fullchain.pem
        owner: kumod
        group: kumod
        mode: "0644"
        remote_src: yes
      when: certbot_result.changed | default(false)

    - name: Copy TLS private key to KumoMTA
      ansible.builtin.copy:
        src: /etc/letsencrypt/live/{{ mta_hostname }}/privkey.pem
        dest: /opt/kumomta/etc/tls/privkey.pem
        owner: kumod
        group: kumod
        mode: "0600"
        remote_src: yes
      when: certbot_result.changed | default(false)

    - name: Create certbot renewal hook for KumoMTA
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          cp /etc/letsencrypt/live/{{ mta_hostname }}/fullchain.pem /opt/kumomta/etc/tls/fullchain.pem
          cp /etc/letsencrypt/live/{{ mta_hostname }}/privkey.pem /opt/kumomta/etc/tls/privkey.pem
          chown kumod:kumod /opt/kumomta/etc/tls/*.pem
          chmod 644 /opt/kumomta/etc/tls/fullchain.pem
          chmod 600 /opt/kumomta/etc/tls/privkey.pem
          systemctl reload kumod || true
        dest: /etc/letsencrypt/renewal-hooks/deploy/kumomta.sh
        owner: root
        group: root
        mode: "0755"
      when: certbot_result.changed | default(false)

  handlers:
    - name: restart kumomta
      ansible.builtin.debug:
        msg: "KumoMTA configuration changed - restart required (service not managed by this playbook)"

    - name: restart tsa
      ansible.builtin.debug:
        msg: "TSA configuration changed - restart required (service not managed by this playbook)"

  post_tasks:
    - name: List installed policy files
      ansible.builtin.find:
        paths: "{{ kumomta_policy_dir }}"
        patterns: "*.lua,*.toml"
      register: policy_files

    - name: Check TLS certificate status
      ansible.builtin.stat:
        path: /opt/kumomta/etc/tls/fullchain.pem
      register: final_tls_check

    - name: Display configuration complete
      ansible.builtin.debug:
        msg: |
          MTA configuration complete for cluster: {{ mta_cluster }}

          Policy files installed:
          {% for file in policy_files.files %}
            - {{ file.path }}
          {% endfor %}

          Environment file: {{ kumomta_env_file }}
            - CONTROL_PLANE_URL: {{ kumomta_control_plane_url }}
            - INTERNAL_SERVICE_KEY: ********** (hidden)
            - WEBHOOK_URL: {{ kumomta_webhook_url }}
            - MTA_HOSTNAME: {{ kumomta_mta_hostname }}
            - TRUSTED_HOSTS: 127.0.0.1,::1,10.0.0.0/8

          DKIM Keys:
            - Private: {{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.key
            - Public:  {{ dkim_base_dir }}/{{ dkim_domain }}/{{ dkim_selector }}.pub
            - Local:   {{ dkim_credentials_dir }}/{{ dkim_domain }}/

          TLS Certificates:
          {% if final_tls_check.stat.exists %}
            - Certificate: /opt/kumomta/etc/tls/fullchain.pem
            - Private Key: /opt/kumomta/etc/tls/privkey.pem
            - Status: CONFIGURED
            - Auto-renewal: /etc/letsencrypt/renewal-hooks/deploy/kumomta.sh
          {% else %}
            - Status: NOT CONFIGURED (certbot may have failed)
          {% endif %}

          ============================================================
          DKIM DNS RECORD (add this to your DNS):
          ============================================================

          Hostname: {{ dkim_selector }}._domainkey.{{ dkim_domain }}
          Type:     TXT
          Value:    v=DKIM1; k=rsa; h=sha256; p={{ dkim_public_key_data }}

          ============================================================

          Next steps:
          - Add the DKIM DNS TXT record above
          - Start KumoMTA services: sudo systemctl start kumod
