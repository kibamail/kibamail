# Provision Proxy Machine
#
# This playbook provisions the proxy machine with:
# - Base system configuration
# - Security hardening
# - IP binding for sending IPs
# - KumoProxy SOCKS5 server
#
# Usage:
#   ansible-playbook playbooks/provision-proxy.yml
#
---
- name: Provision Proxy Machine
  hosts: proxy
  become: yes

  pre_tasks:
    - name: Display provisioning info
      ansible.builtin.debug:
        msg: |
          Provisioning proxy machine: {{ inventory_hostname }}
          - Host: {{ ansible_host }}
          - IPs to bind: {{ proxy_bind_ips | length }}
          - SOCKS5 port: {{ kumoproxy_listen_port }}

  roles:
    - role: common
      tags: [common]

    - role: geerlingguy.security
      tags: [security]

    - role: proxy
      tags: [proxy]

  post_tasks:
    - name: Display provisioning complete
      ansible.builtin.debug:
        msg: |
          Proxy machine provisioned successfully.

          Network interface: {{ proxy_network_interface }}
          Bound IPs: {{ proxy_bind_ips | length }}
          SOCKS5 will listen on: {{ kumoproxy_listen_ip }}:{{ kumoproxy_listen_port }}

          Next steps:
          - Complete KumoProxy installation when instructions are provided
          - Run provision-mta playbook to set up MTA nodes
