# Nginx Role Tasks
---
- name: Display nginx setup info
  ansible.builtin.debug:
    msg: |
      Setting up Nginx on {{ inventory_hostname }}
      - TLS enabled: {{ nginx_tls_enabled }}

- name: Install nginx with stream module
  ansible.builtin.apt:
    name:
      - nginx
      - libnginx-mod-stream
    state: present
    update_cache: yes

- name: Ensure nginx is enabled
  ansible.builtin.systemd:
    name: nginx
    enabled: yes

- name: Create stream.d directory for stream configs
  ansible.builtin.file:
    path: /etc/nginx/stream.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure stream block is in nginx.conf
  ansible.builtin.blockinfile:
    path: /etc/nginx/nginx.conf
    block: |
      stream {
          include /etc/nginx/stream.d/*.conf;
      }
    marker: "# {mark} ANSIBLE MANAGED STREAM BLOCK"
    insertafter: EOF
  notify: Reload nginx

- name: Start nginx
  ansible.builtin.systemd:
    name: nginx
    state: started

- name: Verify nginx is running
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Display nginx setup complete
  ansible.builtin.debug:
    msg: |
      Nginx configured successfully on {{ inventory_hostname }}.
