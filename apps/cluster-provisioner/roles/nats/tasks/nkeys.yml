# NATS NKeys Generation
#
# Generates NKey pairs for:
# - kibamail-agent: Email agent running on MTA nodes
# - kibamail-control-plane: Control plane for injecting emails
#
---
- name: Check if nk tool is installed
  ansible.builtin.stat:
    path: /usr/local/bin/nk
  register: nk_binary

- name: Install Go for nk tool
  ansible.builtin.apt:
    name: golang-go
    state: present
  when: not nk_binary.stat.exists

- name: Install nk tool
  ansible.builtin.shell: |
    GOBIN=/usr/local/bin go install github.com/nats-io/nkeys/nk@v{{ nk_version }}
  environment:
    GOPATH: /tmp/go
  args:
    creates: /usr/local/bin/nk
  when: not nk_binary.stat.exists

# Generate kibamail-agent NKey
- name: Check if agent NKey exists locally
  ansible.builtin.stat:
    path: "{{ nats_credentials_dir }}/kibamail-agent.nkeys"
  register: agent_nkey_file
  delegate_to: localhost
  become: no

- name: Generate agent NKey pair
  ansible.builtin.shell: |
    SEED=$(/usr/local/bin/nk -gen user)
    PUBKEY=$(echo "$SEED" | /usr/local/bin/nk -inkey /dev/stdin -pubout 2>/dev/null || echo "$SEED" | /usr/local/bin/nk -inkey - -pubout)
    echo "$SEED"
    echo "$PUBKEY"
  register: agent_nkey_result
  when: not agent_nkey_file.stat.exists

- name: Save agent NKey locally
  ansible.builtin.copy:
    content: "{{ agent_nkey_result.stdout }}"
    dest: "{{ nats_credentials_dir }}/kibamail-agent.nkeys"
    mode: "0600"
  delegate_to: localhost
  become: no
  when: not agent_nkey_file.stat.exists

# Generate kibamail-control-plane NKey
- name: Check if control-plane NKey exists locally
  ansible.builtin.stat:
    path: "{{ nats_credentials_dir }}/kibamail-control-plane.nkeys"
  register: cp_nkey_file
  delegate_to: localhost
  become: no

- name: Generate control-plane NKey pair
  ansible.builtin.shell: |
    SEED=$(/usr/local/bin/nk -gen user)
    PUBKEY=$(echo "$SEED" | /usr/local/bin/nk -inkey /dev/stdin -pubout 2>/dev/null || echo "$SEED" | /usr/local/bin/nk -inkey - -pubout)
    echo "$SEED"
    echo "$PUBKEY"
  register: cp_nkey_result
  when: not cp_nkey_file.stat.exists

- name: Save control-plane NKey locally
  ansible.builtin.copy:
    content: "{{ cp_nkey_result.stdout }}"
    dest: "{{ nats_credentials_dir }}/kibamail-control-plane.nkeys"
    mode: "0600"
  delegate_to: localhost
  become: no
  when: not cp_nkey_file.stat.exists

# Read NKeys for use in configuration
- name: Read agent NKey file
  ansible.builtin.slurp:
    src: "{{ nats_credentials_dir }}/kibamail-agent.nkeys"
  register: agent_nkey_content
  delegate_to: localhost
  become: no

- name: Read control-plane NKey file
  ansible.builtin.slurp:
    src: "{{ nats_credentials_dir }}/kibamail-control-plane.nkeys"
  register: cp_nkey_content
  delegate_to: localhost
  become: no

- name: Set NKey facts
  ansible.builtin.set_fact:
    nats_agent_seed: "{{ (agent_nkey_content.content | b64decode).split('\n')[0] | trim }}"
    nats_agent_pubkey: "{{ (agent_nkey_content.content | b64decode).split('\n')[1] | trim }}"
    nats_cp_seed: "{{ (cp_nkey_content.content | b64decode).split('\n')[0] | trim }}"
    nats_cp_pubkey: "{{ (cp_nkey_content.content | b64decode).split('\n')[1] | trim }}"

- name: Display NKey info
  ansible.builtin.debug:
    msg: |
      NKeys generated:
      - Agent public key: {{ nats_agent_pubkey }}
      - Control-plane public key: {{ nats_cp_pubkey }}
