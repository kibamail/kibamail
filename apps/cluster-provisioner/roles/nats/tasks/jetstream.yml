# NATS JetStream Setup Tasks
---
- name: Set NATS connection options
  ansible.builtin.set_fact:
    nats_cli_opts: >-
      --server nats://admin:{{ nats_admin_password }}@127.0.0.1:{{ nats_client_port }}
      {% if nats_tls_enabled %}
      --tlsca {{ nats_tls_dir }}/ca.pem
      --tlscert {{ nats_tls_dir }}/client.pem
      --tlskey {{ nats_tls_dir }}/client-key.pem
      {% endif %}

- name: Verify JetStream is enabled
  ansible.builtin.command: >
    /usr/local/bin/nats {{ nats_cli_opts }} account info
  register: jetstream_account
  changed_when: false

- name: Display JetStream account info
  ansible.builtin.debug:
    msg: "{{ jetstream_account.stdout_lines }}"

# Email Commands Stream - for sending commands to agents
- name: Check if COMMANDS stream exists
  ansible.builtin.command: >
    /usr/local/bin/nats {{ nats_cli_opts }} stream info COMMANDS
  register: commands_stream_check
  changed_when: false
  failed_when: false

- name: Create COMMANDS stream
  ansible.builtin.command: >
    /usr/local/bin/nats {{ nats_cli_opts }} stream add COMMANDS
    --subjects "kibamail.commands.>"
    --storage file
    --retention limits
    --max-msgs=-1
    --max-bytes={{ nats_stream_commands_max_bytes }}
    --max-age=24h
    --max-msg-size=-1
    --discard old
    --replicas 1
    --dupe-window=2m
    --no-deny-delete
    --no-deny-purge
    --defaults
  when: commands_stream_check.rc != 0

# Email Events Stream - for agent events/status updates
- name: Check if EVENTS stream exists
  ansible.builtin.command: >
    /usr/local/bin/nats {{ nats_cli_opts }} stream info EVENTS
  register: events_stream_check
  changed_when: false
  failed_when: false

- name: Create EVENTS stream
  ansible.builtin.command: >
    /usr/local/bin/nats {{ nats_cli_opts }} stream add EVENTS
    --subjects "kibamail.events.>"
    --storage file
    --retention limits
    --max-msgs=-1
    --max-bytes={{ nats_stream_events_max_bytes }}
    --max-age=7d
    --max-msg-size=-1
    --discard old
    --replicas 1
    --dupe-window=2m
    --no-deny-delete
    --no-deny-purge
    --defaults
  when: events_stream_check.rc != 0

# Emails Stream - for email injection
- name: Check if EMAILS stream exists
  ansible.builtin.command: >
    /usr/local/bin/nats {{ nats_cli_opts }} stream info EMAILS
  register: emails_stream_check
  changed_when: false
  failed_when: false

- name: Create EMAILS stream
  ansible.builtin.command: >
    /usr/local/bin/nats {{ nats_cli_opts }} stream add EMAILS
    --subjects "kibamail.emails.>"
    --storage file
    --retention work
    --max-msgs=-1
    --max-bytes={{ nats_stream_emails_max_bytes }}
    --max-age=24h
    --max-msg-size=-1
    --discard old
    --replicas 1
    --dupe-window=2m
    --no-deny-delete
    --no-deny-purge
    --defaults
  when: emails_stream_check.rc != 0

- name: List all streams
  ansible.builtin.command: >
    /usr/local/bin/nats {{ nats_cli_opts }} stream list
  register: stream_list
  changed_when: false

- name: Display JetStream streams
  ansible.builtin.debug:
    msg: "{{ stream_list.stdout_lines }}"

# Email Agent Consumer - for processing email injection requests
- name: Check if email_agent_consumer exists
  ansible.builtin.command: >
    /usr/local/bin/nats {{ nats_cli_opts }} consumer info EMAILS email_agent_consumer
  register: email_consumer_check
  changed_when: false
  failed_when: false

- name: Create email_agent_consumer
  ansible.builtin.command: >
    /usr/local/bin/nats {{ nats_cli_opts }} consumer add EMAILS email_agent_consumer
    --filter "kibamail.emails.>"
    --pull
    --deliver all
    --ack explicit
    --max-deliver 5
    --wait 30s
    --max-pending 10000
    --replay instant
    --defaults
  when: email_consumer_check.rc != 0

- name: List all consumers
  ansible.builtin.command: >
    /usr/local/bin/nats {{ nats_cli_opts }} consumer list EMAILS
  register: consumer_list
  changed_when: false

- name: Display EMAILS stream consumers
  ansible.builtin.debug:
    msg: "{{ consumer_list.stdout_lines }}"
