# NATS Configuration Tasks
---
- name: Create PID directory
  ansible.builtin.file:
    path: /var/run/nats
    state: directory
    owner: nats
    group: nats
    mode: "0755"

- name: Deploy NATS server configuration
  ansible.builtin.template:
    src: nats-server.conf.j2
    dest: /etc/nats/nats-server.conf
    owner: nats
    group: nats
    mode: "0640"
    validate: "/usr/local/bin/nats-server --config %s -t"
  notify: Restart nats

- name: Display configuration info
  ansible.builtin.debug:
    msg: |
      NATS configuration deployed:
      - Config: /etc/nats/nats-server.conf
      - TLS: {{ nats_tls_enabled }}
      - JetStream: {{ nats_jetstream_enabled }}
