# NATS Systemd Service Tasks
---
- name: Deploy NATS systemd service
  ansible.builtin.template:
    src: nats.service.j2
    dest: /etc/systemd/system/nats.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart nats

- name: Enable NATS service
  ansible.builtin.systemd:
    name: nats
    enabled: yes
    daemon_reload: yes

- name: Start NATS service
  ansible.builtin.systemd:
    name: nats
    state: started
  register: nats_start_result

- name: Wait for NATS to be ready
  ansible.builtin.wait_for:
    port: "{{ nats_client_port }}"
    host: 127.0.0.1
    delay: 2
    timeout: 30

- name: Verify NATS is running
  ansible.builtin.command: >
    /usr/local/bin/nats account info
    --server nats://admin:{{ nats_admin_password }}@127.0.0.1:{{ nats_client_port }}
    {% if nats_tls_enabled %}
    --tlsca {{ nats_tls_dir }}/ca.pem
    --tlscert {{ nats_tls_dir }}/client.pem
    --tlskey {{ nats_tls_dir }}/client-key.pem
    {% endif %}
  register: nats_info
  changed_when: false

- name: Display NATS account info
  ansible.builtin.debug:
    msg: "{{ nats_info.stdout_lines }}"
