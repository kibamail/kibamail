# NATS TLS Certificate Generation
#
# Generates self-signed CA and certificates for NATS TLS.
#
---
- name: Install openssl
  ansible.builtin.apt:
    name: openssl
    state: present

# CA Certificate
- name: Check if CA certificate exists locally
  ansible.builtin.stat:
    path: "{{ nats_credentials_dir }}/ca.pem"
  register: ca_cert_file
  delegate_to: localhost
  become: no

- name: Generate CA private key
  community.crypto.openssl_privatekey:
    path: "{{ nats_credentials_dir }}/ca-key.pem"
    size: 4096
    mode: "0600"
  delegate_to: localhost
  become: no
  when: not ca_cert_file.stat.exists

- name: Generate CA CSR
  community.crypto.openssl_csr:
    path: "{{ nats_credentials_dir }}/ca.csr"
    privatekey_path: "{{ nats_credentials_dir }}/ca-key.pem"
    common_name: "NATS CA"
    basic_constraints:
      - CA:TRUE
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true
  delegate_to: localhost
  become: no
  when: not ca_cert_file.stat.exists

- name: Generate CA certificate
  community.crypto.x509_certificate:
    path: "{{ nats_credentials_dir }}/ca.pem"
    csr_path: "{{ nats_credentials_dir }}/ca.csr"
    privatekey_path: "{{ nats_credentials_dir }}/ca-key.pem"
    provider: selfsigned
    selfsigned_not_after: "+{{ nats_ca_validity_days }}d"
    mode: "0644"
  delegate_to: localhost
  become: no
  when: not ca_cert_file.stat.exists

# Server Certificate
- name: Check if server certificate exists locally
  ansible.builtin.stat:
    path: "{{ nats_credentials_dir }}/server.pem"
  register: server_cert_file
  delegate_to: localhost
  become: no

- name: Generate server private key
  community.crypto.openssl_privatekey:
    path: "{{ nats_credentials_dir }}/server-key.pem"
    size: 4096
    mode: "0600"
  delegate_to: localhost
  become: no
  when: not server_cert_file.stat.exists

- name: Generate server CSR
  community.crypto.openssl_csr:
    path: "{{ nats_credentials_dir }}/server.csr"
    privatekey_path: "{{ nats_credentials_dir }}/server-key.pem"
    common_name: "nats-server"
    subject_alt_name:
      - "DNS:localhost"
      - "DNS:{{ inventory_hostname }}"
      - "IP:127.0.0.1"
      - "IP:{{ ansible_host }}"
    extended_key_usage:
      - serverAuth
      - clientAuth
  delegate_to: localhost
  become: no
  when: not server_cert_file.stat.exists

- name: Generate server certificate
  community.crypto.x509_certificate:
    path: "{{ nats_credentials_dir }}/server.pem"
    csr_path: "{{ nats_credentials_dir }}/server.csr"
    ownca_path: "{{ nats_credentials_dir }}/ca.pem"
    ownca_privatekey_path: "{{ nats_credentials_dir }}/ca-key.pem"
    provider: ownca
    ownca_not_after: "+{{ nats_cert_validity_days }}d"
    mode: "0644"
  delegate_to: localhost
  become: no
  when: not server_cert_file.stat.exists

# Client Certificate
- name: Check if client certificate exists locally
  ansible.builtin.stat:
    path: "{{ nats_credentials_dir }}/client.pem"
  register: client_cert_file
  delegate_to: localhost
  become: no

- name: Generate client private key
  community.crypto.openssl_privatekey:
    path: "{{ nats_credentials_dir }}/client-key.pem"
    size: 4096
    mode: "0600"
  delegate_to: localhost
  become: no
  when: not client_cert_file.stat.exists

- name: Generate client CSR
  community.crypto.openssl_csr:
    path: "{{ nats_credentials_dir }}/client.csr"
    privatekey_path: "{{ nats_credentials_dir }}/client-key.pem"
    common_name: "nats-client"
    extended_key_usage:
      - clientAuth
  delegate_to: localhost
  become: no
  when: not client_cert_file.stat.exists

- name: Generate client certificate
  community.crypto.x509_certificate:
    path: "{{ nats_credentials_dir }}/client.pem"
    csr_path: "{{ nats_credentials_dir }}/client.csr"
    ownca_path: "{{ nats_credentials_dir }}/ca.pem"
    ownca_privatekey_path: "{{ nats_credentials_dir }}/ca-key.pem"
    provider: ownca
    ownca_not_after: "+{{ nats_cert_validity_days }}d"
    mode: "0644"
  delegate_to: localhost
  become: no
  when: not client_cert_file.stat.exists

# Deploy certificates to server
- name: Deploy CA certificate
  ansible.builtin.copy:
    src: "{{ nats_credentials_dir }}/ca.pem"
    dest: "{{ nats_tls_dir }}/ca.pem"
    owner: nats
    group: nats
    mode: "0644"
  notify: Restart nats

- name: Deploy server certificate
  ansible.builtin.copy:
    src: "{{ nats_credentials_dir }}/server.pem"
    dest: "{{ nats_tls_dir }}/server.pem"
    owner: nats
    group: nats
    mode: "0644"
  notify: Restart nats

- name: Deploy server private key
  ansible.builtin.copy:
    src: "{{ nats_credentials_dir }}/server-key.pem"
    dest: "{{ nats_tls_dir }}/server-key.pem"
    owner: nats
    group: nats
    mode: "0600"
  notify: Restart nats

- name: Deploy client certificate (for CLI)
  ansible.builtin.copy:
    src: "{{ nats_credentials_dir }}/client.pem"
    dest: "{{ nats_tls_dir }}/client.pem"
    owner: nats
    group: nats
    mode: "0644"

- name: Deploy client private key (for CLI)
  ansible.builtin.copy:
    src: "{{ nats_credentials_dir }}/client-key.pem"
    dest: "{{ nats_tls_dir }}/client-key.pem"
    owner: nats
    group: nats
    mode: "0600"

- name: Display certificate info
  ansible.builtin.debug:
    msg: "TLS certificates deployed to {{ nats_tls_dir }}"
