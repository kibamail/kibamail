# NATS Admin Password Generation
---
- name: Check if admin password already exists locally
  ansible.builtin.stat:
    path: "{{ nats_credentials_dir }}/admin.key"
  register: admin_key_file
  delegate_to: localhost
  become: no

- name: Generate admin password
  ansible.builtin.command: openssl rand -hex 24
  register: admin_password_generated
  delegate_to: localhost
  become: no
  when: not admin_key_file.stat.exists

- name: Save admin password locally
  ansible.builtin.copy:
    content: "{{ admin_password_generated.stdout }}"
    dest: "{{ nats_credentials_dir }}/admin.key"
    mode: "0600"
  delegate_to: localhost
  become: no
  when: not admin_key_file.stat.exists

- name: Read admin password
  ansible.builtin.slurp:
    src: "{{ nats_credentials_dir }}/admin.key"
  register: admin_password_file
  delegate_to: localhost
  become: no

- name: Set admin password fact
  ansible.builtin.set_fact:
    nats_admin_password: "{{ admin_password_file.content | b64decode | trim }}"

- name: Install python3-bcrypt for password hashing
  ansible.builtin.apt:
    name: python3-bcrypt
    state: present

- name: Generate bcrypt hash for admin password
  ansible.builtin.shell: |
    python3 -c "import bcrypt; print(bcrypt.hashpw('{{ nats_admin_password }}'.encode(), bcrypt.gensalt()).decode())"
  register: admin_password_hash_result
  changed_when: false
  no_log: true

- name: Set admin password hash fact
  ansible.builtin.set_fact:
    nats_admin_password_hash: "{{ admin_password_hash_result.stdout | trim }}"
  no_log: true

- name: Display admin password info
  ansible.builtin.debug:
    msg: "Admin password generated and hashed (stored in {{ nats_credentials_dir }}/admin.key)"
