# KumoProxy Role Tasks
#
# Installs KumoMTA package (includes proxy-server) and configures
# KumoProxy as a systemd service on the MTA server.
#
# Note: IPs are already bound on Hostkey server, no ip-binding needed.
#
---
- name: Display kumoproxy setup info
  ansible.builtin.debug:
    msg: |
      Setting up KumoProxy on {{ inventory_hostname }}
      - Listen: {{ kumoproxy_listen_ip }}:{{ kumoproxy_listen_port }}

- name: Install KumoMTA dependencies
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - ca-certificates
    state: present
    update_cache: yes

- name: Add KumoMTA GPG key
  ansible.builtin.shell: |
    curl -fsSL https://openrepo.kumomta.com/kumomta-ubuntu-22/public.gpg | gpg --yes --dearmor -o /usr/share/keyrings/kumomta.gpg
    chmod 644 /usr/share/keyrings/kumomta.gpg
  args:
    creates: /usr/share/keyrings/kumomta.gpg

- name: Add KumoMTA repository
  ansible.builtin.get_url:
    url: https://openrepo.kumomta.com/files/kumomta-ubuntu22.list
    dest: /etc/apt/sources.list.d/kumomta.list
    mode: "0644"

- name: Update apt cache after adding KumoMTA repository
  ansible.builtin.apt:
    update_cache: yes

- name: Install KumoMTA
  ansible.builtin.apt:
    name: kumomta
    state: present

- name: Ensure KumoMTA etc directory exists
  ansible.builtin.file:
    path: /opt/kumomta/etc
    state: directory
    mode: "0755"

- name: Deploy KumoProxy environment file
  ansible.builtin.template:
    src: kumoproxy.env.j2
    dest: /opt/kumomta/etc/kumoproxy.env
    mode: "0644"
  notify: Restart kumoproxy

- name: Deploy KumoProxy systemd service
  ansible.builtin.template:
    src: kumoproxy.service.j2
    dest: /etc/systemd/system/kumoproxy.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart kumoproxy

- name: Enable and start KumoProxy service
  ansible.builtin.systemd:
    name: kumoproxy
    state: started
    enabled: yes
    daemon_reload: yes

- name: Verify KumoProxy is running
  ansible.builtin.command: systemctl status kumoproxy
  register: kumoproxy_status
  changed_when: false

- name: Display KumoProxy status
  ansible.builtin.debug:
    msg: "KumoProxy is running on {{ kumoproxy_listen_ip }}:{{ kumoproxy_listen_port }}"
