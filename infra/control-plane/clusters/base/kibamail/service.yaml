apiVersion: v1
kind: Service
metadata:
  name: kibamail-web
  namespace: kibamail
  labels:
    app.kubernetes.io/name: kibamail-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: kibamail
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    # Internal HTTP port for cluster-internal traffic (e.g., tracking service)
    - name: http-internal
      port: 3000
      targetPort: cp-http
      protocol: TCP
  selector:
    app.kubernetes.io/name: kibamail-web
