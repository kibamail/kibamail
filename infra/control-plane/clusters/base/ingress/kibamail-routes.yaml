# TLSRoute for kibamail.com (apex domain)
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kibamail-apex
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: tls-kibamail-apex
  hostnames:
    - kibamail.com
  rules:
    - backendRefs:
        - name: kibamail-web
          namespace: kibamail
          port: 443
---
# TLSRoute for www.kibamail.com
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kibamail-www
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: tls-kibamail
  hostnames:
    - www.kibamail.com
  rules:
    - backendRefs:
        - name: kibamail-web
          namespace: kibamail
          port: 443
---
# TLSRoute for api.kibamail.com
# Routes to same kibamail-web service, nginx handles /api routing
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kibamail-api
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: tls-kibamail
  hostnames:
    - api.kibamail.com
  rules:
    - backendRefs:
        - name: kibamail-web
          namespace: kibamail
          port: 443
---
# TLSRoute for forms.kibamail.com
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kibamail-forms
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: tls-kibamail
  hostnames:
    - forms.kibamail.com
  rules:
    - backendRefs:
        - name: kibamail-web
          namespace: kibamail
          port: 443
---
# TLSRoute for auth.kibamail.com
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: logto-main
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: tls-kibamail
  hostnames:
    - auth.kibamail.com
  rules:
    - backendRefs:
        - name: logto
          namespace: logto
          port: 443
---
# TLSRoute for admin.auth.kibamail.com
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: logto-admin
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: tls-kibamail
  hostnames:
    - admin.auth.kibamail.com
  rules:
    - backendRefs:
        - name: logto
          namespace: logto
          port: 443
---
# TLSRoute catch-all for customer tracking domains
# Any hostname not matching specific routes goes here
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kibamail-tracking
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: tls-tracking-catchall
  rules:
    - backendRefs:
        - name: kibamail-tracking
          namespace: kibamail-tracking
          port: 443
---
# ReferenceGrant: Allow TLSRoutes in default namespace to reference kibamail service
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-kibamail
  namespace: kibamail
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: TLSRoute
      namespace: default
  to:
    - group: ""
      kind: Service
---
# ReferenceGrant: Allow TLSRoutes in default namespace to reference logto service
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-logto
  namespace: logto
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: TLSRoute
      namespace: default
  to:
    - group: ""
      kind: Service
---
# ReferenceGrant: Allow TLSRoutes in default namespace to reference tracking service
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-tracking
  namespace: kibamail-tracking
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: TLSRoute
      namespace: default
  to:
    - group: ""
      kind: Service
