apiVersion: v1
kind: ConfigMap
metadata:
  name: kibamail-gateway-config
data:
  deployment: |
    spec:
      template:
        spec:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          securityContext:
            sysctls: []
  service: |
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kibamail-gateway
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: kibamail-gateway-config
  listeners:
    # HTTP listener for ACME challenges and health checks
    - name: http
      protocol: HTTP
      port: 30080
      allowedRoutes:
        namespaces:
          from: All

    # TLS Passthrough for *.kibamail.com (subdomains)
    - name: tls-kibamail
      protocol: TLS
      port: 30443
      hostname: "*.kibamail.com"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TLSRoute

    # TLS Passthrough for kibamail.com (apex domain)
    - name: tls-kibamail-apex
      protocol: TLS
      port: 30443
      hostname: kibamail.com
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TLSRoute

    # TLS Passthrough catch-all for customer tracking domains
    # Any hostname not matching above goes to tracking for dynamic cert handling
    - name: tls-tracking-catchall
      protocol: TLS
      port: 30443
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TLSRoute
