apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: logto
          namespace: logto
          port: 3001
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# ACME HTTP-01 Challenge Route
# Routes Let's Encrypt validation requests directly to tracking service
# without redirecting to HTTPS (required for SSL certificate issuance)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: acme-challenge-http
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/acme-challenge/
      backendRefs:
        - name: kibamail-tracking
          namespace: kibamail-tracking
          port: 3100
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-health-check
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: logto
          namespace: logto
          port: 3001
