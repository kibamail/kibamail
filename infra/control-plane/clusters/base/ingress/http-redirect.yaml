apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: logto
          namespace: logto
          port: 3001
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-health-check
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: logto
          namespace: logto
          port: 3001
