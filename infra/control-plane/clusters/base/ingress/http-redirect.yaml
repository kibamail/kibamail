# HTTP to HTTPS redirect (except ACME challenges)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: http
  rules:
    # Redirect everything to HTTPS
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# ACME HTTP-01 Challenge Route
# Routes Let's Encrypt validation requests directly to tracking service
# without redirecting to HTTPS (required for SSL certificate issuance)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: acme-challenge-http
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/acme-challenge/
      backendRefs:
        - name: kibamail-tracking
          namespace: kibamail-tracking
          port: 80
---
# ReferenceGrant for HTTP routes to kibamail namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-http-routes-to-kibamail
  namespace: kibamail
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: ""
      kind: Service
---
# ReferenceGrant for HTTP routes to tracking namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-http-routes-to-tracking
  namespace: kibamail-tracking
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: ""
      kind: Service
