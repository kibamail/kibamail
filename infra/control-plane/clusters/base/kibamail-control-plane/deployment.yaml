apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-control-plane
  namespace: kibamail-control-plane
  labels:
    app.kubernetes.io/name: kibamail-control-plane
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: kibamail
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kibamail-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibamail-control-plane
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: kibamail
        service.name: kibamail-control-plane
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kibamail-control-plane
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: migrations
          image: ghcr.io/kibamail/kibamail:staging-cli
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - |
              echo "Checking for pending migrations..."
              PENDING=$(pnpm exec prisma migrate status 2>&1 | grep -c "Following migration" || true)
              if [ "$PENDING" -gt 0 ]; then
                echo "Running Prisma migrations..."
                pnpm exec prisma migrate deploy
              else
                echo "No pending migrations, skipping."
              fi
              echo "Running RBAC sync..."
              pnpm exec tsx scripts/rbac-sync.ts
              echo "Init complete!"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-postgres
                  key: DATABASE_URL
            - name: LOGTO_TENANT_ID
              value: "default"
            - name: LOGTO_ENDPOINT
              value: "https://auth.staging.kibamail.com"
            - name: LOGTO_M2M_APP_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-logto
                  key: M2M_APP_ID
            - name: LOGTO_M2M_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-logto
                  key: M2M_APP_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: web
          image: ghcr.io/kibamail/kibamail:staging
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: "kibamail-control-plane"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=kibamail-control-plane,deployment.environment=staging,host.name=$(NODE_NAME),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name=kibamail-control-plane"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-postgres
                  key: DATABASE_URL
            - name: REDIS_HOST
              value: "kibamail-valkey.kibamail-valkey.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-plane-valkey
                  key: password
            - name: REDIS_DATABASE
              value: "0"
            - name: REDIS_CLUSTER_MODE
              value: "true"
            - name: LOGTO_TENANT_ID
              value: "default"
            - name: LOGTO_ENDPOINT
              value: "https://auth.staging.kibamail.com"
            - name: LOGTO_APP_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-logto
                  key: APP_ID
            - name: LOGTO_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-logto
                  key: APP_SECRET
            - name: LOGTO_BASE_URL
              value: "https://staging.kibamail.com"
            - name: LOGTO_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-credentials
                  key: LOGTO_COOKIE_SECRET
            - name: LOGTO_COOKIE_SECURE
              value: "true"
            - name: LOGTO_M2M_APP_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-logto
                  key: M2M_APP_ID
            - name: LOGTO_M2M_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-logto
                  key: M2M_APP_SECRET
            - name: OUTPOST_API_URL
              value: "http://outpost.outpost.svc.cluster.local:3333"
            - name: OUTPOST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-outpost
                  key: API_KEY
            - name: OUTPOST_API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-outpost
                  key: API_JWT_SECRET
            - name: OUTPOST_AES_ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-outpost
                  key: AES_ENCRYPTION_SECRET
            - name: OUTPOST_REDIS_HOST
              value: "kibamail-valkey.kibamail-valkey.svc.cluster.local"
            - name: OUTPOST_REDIS_PORT
              value: "6379"
            - name: OUTPOST_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-plane-valkey
                  key: password
            - name: OUTPOST_REDIS_DATABASE
              value: "1"
            - name: S3_PUBLIC_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-public
                  key: ENDPOINT
            - name: S3_PUBLIC_REGION
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-public
                  key: REGION
            - name: S3_PUBLIC_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-public
                  key: ACCESS_KEY_ID
            - name: S3_PUBLIC_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-public
                  key: SECRET_ACCESS_KEY
            - name: S3_PUBLIC_BUCKET
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-public
                  key: BUCKET
            - name: S3_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-public
                  key: PUBLIC_URL
            - name: S3_PRIVATE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-private
                  key: ENDPOINT
            - name: S3_PRIVATE_REGION
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-private
                  key: REGION
            - name: S3_PRIVATE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-private
                  key: ACCESS_KEY_ID
            - name: S3_PRIVATE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-private
                  key: SECRET_ACCESS_KEY
            - name: S3_PRIVATE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-private
                  key: BUCKET
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-credentials
                  key: APP_KEY
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-credentials
                  key: INTERNAL_SERVICE_KEY
            - name: OTEL_INGESTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-credentials
                  key: OTEL_INGESTION_API_KEY

            # NATS Configuration
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-nats
                  key: NATS_URL
            - name: NATS_NKEY_SEED
              valueFrom:
                secretKeyRef:
                  name: control-plane-nats
                  key: NATS_NKEY_SEED
            - name: NATS_TLS_CA
              valueFrom:
                secretKeyRef:
                  name: control-plane-nats
                  key: NATS_TLS_CA
            - name: NATS_TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: control-plane-nats
                  key: NATS_TLS_CERT
            - name: NATS_TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-nats
                  key: NATS_TLS_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: nginx-http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: nginx-config
          configMap:
            name: kibamail-control-plane-nginx
        - name: nginx-cache
          emptyDir: {}
