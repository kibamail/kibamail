apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: control-plane-postgres
  namespace: kibamail-control-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: control-plane-postgres
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: CONTROL_PLANE_DATABASE_URL
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: control-plane-valkey
  namespace: kibamail-control-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-valkey
    kind: ClusterSecretStore
  target:
    name: control-plane-valkey
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: kibamail-valkey
---
