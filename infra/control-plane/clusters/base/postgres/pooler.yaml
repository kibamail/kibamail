apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: kibamail-postgres-pooler-rw
spec:
  cluster:
    name: kibamail-postgres
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: kibamail-postgres-pooler-ro
spec:
  cluster:
    name: kibamail-postgres
  instances: 2
  type: ro
  pgbouncer:
    poolMode: transaction
