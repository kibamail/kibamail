apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kibamail-postgres
spec:
  instances: 3

  bootstrap:
    initdb:
      database: kibamail
      owner: kibamail
      secret:
        name: kibamail-postgres-credentials
      postInitSQL:
        - ALTER USER kibamail WITH CREATEROLE
        - CREATE DATABASE logto OWNER kibamail
        - CREATE DATABASE outpost OWNER kibamail

  storage:
    size: 20Gi
    storageClass: kibamail-storage

  # Monitoring configuration for Prometheus/SigNoz
  monitoring:
    # Don't use PodMonitor (requires Prometheus Operator)
    # We use SigNoz k8s-infra Prometheus scraping instead
    enablePodMonitor: false
    # Keep default CNPG metrics
    disableDefaultQueries: false
    # Custom monitoring queries for extended metrics
    customQueriesConfigMap:
      - name: cnpg-custom-monitoring
        key: custom-queries

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: kibamail-backup-store
