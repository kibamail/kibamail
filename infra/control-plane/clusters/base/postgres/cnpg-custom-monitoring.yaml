# Custom PostgreSQL monitoring queries for CloudNativePG
# These queries extend the default cnpg-default-monitoring ConfigMap
# with additional metrics for comprehensive observability.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpg-custom-monitoring
data:
  custom-queries: |
    # Replication status metrics
    pg_replication:
      query: |
        SELECT
          CASE WHEN pg_is_in_recovery() THEN 1 ELSE 0 END AS in_recovery,
          COALESCE(EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp()))::bigint, 0) AS lag_seconds,
          COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn)::bigint, 0) AS lag_bytes
        FROM pg_stat_replication
        LIMIT 1
      primary: true
      metrics:
        - in_recovery:
            usage: "GAUGE"
            description: "Whether instance is in recovery mode (1=replica, 0=primary)"
        - lag_seconds:
            usage: "GAUGE"
            description: "Replication lag in seconds"
        - lag_bytes:
            usage: "GAUGE"
            description: "Replication lag in bytes"

    # Database size metrics
    pg_database_size:
      query: |
        SELECT
          datname,
          pg_database_size(datname) as size_bytes
        FROM pg_database
        WHERE datname NOT IN ('template0', 'template1')
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - size_bytes:
            usage: "GAUGE"
            description: "Database size in bytes"

    # Connection statistics by state
    pg_stat_activity_state:
      query: |
        SELECT
          datname,
          state,
          COUNT(*) as connections
        FROM pg_stat_activity
        WHERE datname IS NOT NULL
        GROUP BY datname, state
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - state:
            usage: "LABEL"
            description: "Connection state (active, idle, idle in transaction, etc.)"
        - connections:
            usage: "GAUGE"
            description: "Number of connections in this state"

    # Total connections per database
    pg_connections:
      query: |
        SELECT
          datname,
          COUNT(*) as total,
          COUNT(*) FILTER (WHERE state = 'active') as active,
          COUNT(*) FILTER (WHERE state = 'idle') as idle,
          COUNT(*) FILTER (WHERE state = 'idle in transaction') as idle_in_transaction,
          COUNT(*) FILTER (WHERE wait_event_type IS NOT NULL) as waiting
        FROM pg_stat_activity
        WHERE datname IS NOT NULL
        GROUP BY datname
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - total:
            usage: "GAUGE"
            description: "Total connections to database"
        - active:
            usage: "GAUGE"
            description: "Active connections"
        - idle:
            usage: "GAUGE"
            description: "Idle connections"
        - idle_in_transaction:
            usage: "GAUGE"
            description: "Connections idle in transaction"
        - waiting:
            usage: "GAUGE"
            description: "Connections waiting on locks"

    # Lock statistics
    pg_locks_count:
      query: |
        SELECT
          pg_database.datname,
          mode,
          COUNT(*) as count
        FROM pg_locks
        JOIN pg_database ON pg_locks.database = pg_database.oid
        WHERE pg_database.datname NOT IN ('template0', 'template1')
        GROUP BY datname, mode
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - mode:
            usage: "LABEL"
            description: "Lock mode"
        - count:
            usage: "GAUGE"
            description: "Number of locks"

    # Table statistics
    pg_stat_user_tables:
      query: |
        SELECT
          current_database() as datname,
          schemaname,
          relname,
          seq_scan,
          seq_tup_read,
          idx_scan,
          idx_tup_fetch,
          n_tup_ins,
          n_tup_upd,
          n_tup_del,
          n_live_tup,
          n_dead_tup,
          COALESCE(last_vacuum, '1970-01-01'::timestamp) as last_vacuum,
          COALESCE(last_autovacuum, '1970-01-01'::timestamp) as last_autovacuum,
          COALESCE(last_analyze, '1970-01-01'::timestamp) as last_analyze,
          COALESCE(last_autoanalyze, '1970-01-01'::timestamp) as last_autoanalyze
        FROM pg_stat_user_tables
        WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
        ORDER BY n_live_tup DESC
        LIMIT 50
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - schemaname:
            usage: "LABEL"
            description: "Schema name"
        - relname:
            usage: "LABEL"
            description: "Table name"
        - seq_scan:
            usage: "COUNTER"
            description: "Sequential scans initiated"
        - seq_tup_read:
            usage: "COUNTER"
            description: "Rows fetched by sequential scans"
        - idx_scan:
            usage: "COUNTER"
            description: "Index scans initiated"
        - idx_tup_fetch:
            usage: "COUNTER"
            description: "Rows fetched by index scans"
        - n_tup_ins:
            usage: "COUNTER"
            description: "Rows inserted"
        - n_tup_upd:
            usage: "COUNTER"
            description: "Rows updated"
        - n_tup_del:
            usage: "COUNTER"
            description: "Rows deleted"
        - n_live_tup:
            usage: "GAUGE"
            description: "Estimated live rows"
        - n_dead_tup:
            usage: "GAUGE"
            description: "Estimated dead rows"

    # Slow queries (longest running)
    pg_stat_activity_longest:
      query: |
        SELECT
          datname,
          usename,
          state,
          EXTRACT(EPOCH FROM (now() - query_start))::bigint as duration_seconds,
          wait_event_type,
          wait_event
        FROM pg_stat_activity
        WHERE state != 'idle'
          AND query NOT LIKE '%pg_stat_activity%'
          AND datname IS NOT NULL
        ORDER BY query_start ASC
        LIMIT 10
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - usename:
            usage: "LABEL"
            description: "User name"
        - state:
            usage: "LABEL"
            description: "Query state"
        - duration_seconds:
            usage: "GAUGE"
            description: "Query duration in seconds"
        - wait_event_type:
            usage: "LABEL"
            description: "Wait event type"
        - wait_event:
            usage: "LABEL"
            description: "Wait event"

    # Database transaction statistics
    pg_stat_database_xact:
      query: |
        SELECT
          datname,
          xact_commit,
          xact_rollback,
          blks_read,
          blks_hit,
          tup_returned,
          tup_fetched,
          tup_inserted,
          tup_updated,
          tup_deleted,
          conflicts,
          deadlocks,
          temp_files,
          temp_bytes
        FROM pg_stat_database
        WHERE datname NOT IN ('template0', 'template1')
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - xact_commit:
            usage: "COUNTER"
            description: "Transactions committed"
        - xact_rollback:
            usage: "COUNTER"
            description: "Transactions rolled back"
        - blks_read:
            usage: "COUNTER"
            description: "Disk blocks read"
        - blks_hit:
            usage: "COUNTER"
            description: "Buffer cache hits"
        - tup_returned:
            usage: "COUNTER"
            description: "Rows returned by queries"
        - tup_fetched:
            usage: "COUNTER"
            description: "Rows fetched by queries"
        - tup_inserted:
            usage: "COUNTER"
            description: "Rows inserted"
        - tup_updated:
            usage: "COUNTER"
            description: "Rows updated"
        - tup_deleted:
            usage: "COUNTER"
            description: "Rows deleted"
        - conflicts:
            usage: "COUNTER"
            description: "Queries canceled due to conflicts"
        - deadlocks:
            usage: "COUNTER"
            description: "Deadlocks detected"
        - temp_files:
            usage: "COUNTER"
            description: "Temporary files created"
        - temp_bytes:
            usage: "COUNTER"
            description: "Temporary file bytes written"

    # Cache hit ratio
    pg_cache_hit_ratio:
      query: |
        SELECT
          datname,
          CASE WHEN blks_read + blks_hit = 0 THEN 0
               ELSE (blks_hit::float / (blks_read + blks_hit)::float * 100)::numeric(5,2)
          END as cache_hit_ratio
        FROM pg_stat_database
        WHERE datname NOT IN ('template0', 'template1')
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - cache_hit_ratio:
            usage: "GAUGE"
            description: "Buffer cache hit ratio percentage"

    # WAL statistics
    pg_stat_wal:
      query: |
        SELECT
          wal_records,
          wal_fpi,
          wal_bytes,
          wal_buffers_full,
          wal_write,
          wal_sync,
          EXTRACT(EPOCH FROM wal_write_time)::bigint as wal_write_time_ms,
          EXTRACT(EPOCH FROM wal_sync_time)::bigint as wal_sync_time_ms
        FROM pg_stat_wal
      primary: true
      metrics:
        - wal_records:
            usage: "COUNTER"
            description: "Total WAL records generated"
        - wal_fpi:
            usage: "COUNTER"
            description: "Full page images generated"
        - wal_bytes:
            usage: "COUNTER"
            description: "Total WAL bytes generated"
        - wal_buffers_full:
            usage: "COUNTER"
            description: "Times WAL buffers were full"
        - wal_write:
            usage: "COUNTER"
            description: "WAL write operations"
        - wal_sync:
            usage: "COUNTER"
            description: "WAL sync operations"
        - wal_write_time_ms:
            usage: "COUNTER"
            description: "Time spent writing WAL (ms)"
        - wal_sync_time_ms:
            usage: "COUNTER"
            description: "Time spent syncing WAL (ms)"

    # Checkpoint statistics
    pg_stat_bgwriter:
      query: |
        SELECT
          checkpoints_timed,
          checkpoints_req,
          checkpoint_write_time,
          checkpoint_sync_time,
          buffers_checkpoint,
          buffers_clean,
          maxwritten_clean,
          buffers_backend,
          buffers_backend_fsync,
          buffers_alloc
        FROM pg_stat_bgwriter
      primary: true
      metrics:
        - checkpoints_timed:
            usage: "COUNTER"
            description: "Scheduled checkpoints"
        - checkpoints_req:
            usage: "COUNTER"
            description: "Requested checkpoints"
        - checkpoint_write_time:
            usage: "COUNTER"
            description: "Time writing checkpoint files (ms)"
        - checkpoint_sync_time:
            usage: "COUNTER"
            description: "Time syncing checkpoint files (ms)"
        - buffers_checkpoint:
            usage: "COUNTER"
            description: "Buffers written during checkpoints"
        - buffers_clean:
            usage: "COUNTER"
            description: "Buffers written by background writer"
        - maxwritten_clean:
            usage: "COUNTER"
            description: "Times bgwriter stopped for max writes"
        - buffers_backend:
            usage: "COUNTER"
            description: "Buffers written by backends"
        - buffers_backend_fsync:
            usage: "COUNTER"
            description: "Backend fsync calls"
        - buffers_alloc:
            usage: "COUNTER"
            description: "Buffers allocated"

    # Index usage statistics
    pg_stat_user_indexes:
      query: |
        SELECT
          current_database() as datname,
          schemaname,
          relname as table_name,
          indexrelname as index_name,
          idx_scan,
          idx_tup_read,
          idx_tup_fetch,
          pg_relation_size(indexrelid) as index_size_bytes
        FROM pg_stat_user_indexes
        WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
        ORDER BY idx_scan DESC
        LIMIT 50
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - schemaname:
            usage: "LABEL"
            description: "Schema name"
        - table_name:
            usage: "LABEL"
            description: "Table name"
        - index_name:
            usage: "LABEL"
            description: "Index name"
        - idx_scan:
            usage: "COUNTER"
            description: "Index scans initiated"
        - idx_tup_read:
            usage: "COUNTER"
            description: "Index entries read"
        - idx_tup_fetch:
            usage: "COUNTER"
            description: "Table rows fetched"
        - index_size_bytes:
            usage: "GAUGE"
            description: "Index size in bytes"
