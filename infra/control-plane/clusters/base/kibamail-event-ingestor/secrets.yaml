apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: control-plane-postgres
  namespace: kibamail-event-ingestor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: control-plane-postgres
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: CONTROL_PLANE_DATABASE_URL
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: control-plane-valkey
