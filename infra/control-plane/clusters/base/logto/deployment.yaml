apiVersion: apps/v1
kind: Deployment
metadata:
  name: logto
  labels:
    app.kubernetes.io/name: logto
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: kibamail
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: logto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logto
        app.kubernetes.io/component: auth
        app.kubernetes.io/part-of: kibamail
        service.name: logto
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: logto
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h kibamail-postgres-rw.cnpg-system.svc.cluster.local -p 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
      containers:
        - name: logto
          image: svhd/logto:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - npm run cli db seed -- --swe && npm start
          ports:
            - name: http-main
              containerPort: 3001
              protocol: TCP
            - name: http-admin
              containerPort: 3002
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name=logto"
            - name: TRUST_PROXY_HEADER
              value: "true"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: logto-config
                  key: DB_URL
            - name: ENDPOINT
              value: "https://auth.staging.kibamail.com"
            - name: ADMIN_ENDPOINT
              value: "https://admin.auth.staging.kibamail.com"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/status
              port: http-main
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/status
              port: http-main
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
