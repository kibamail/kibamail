apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: logto-main
spec:
  parentRefs:
    - name: kibamail-gateway
      namespace: default
      sectionName: https
  hostnames:
    - auth.staging.kibamail.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: logto
          port: 3001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: logto-admin
spec:
  parentRefs:
    - name: kibamail-gateway
      namespace: default
      sectionName: https
  hostnames:
    - admin.auth.staging.kibamail.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: logto
          port: 3002
