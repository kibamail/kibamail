# ExternalSecret to pull PostgreSQL credentials from Infisical
# Used by the OTel collector for PostgreSQL metrics collection
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: signoz-postgres-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: signoz-postgres-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # PostgreSQL connection details for OTel collector
        POSTGRES_USER: kibamail
        POSTGRES_PASSWORD: "{{ .password }}"
        # Connection string format for OTel PostgreSQL receiver
        POSTGRES_ENDPOINT: "kibamail-postgres-rw.cnpg-system.svc.cluster.local:5432"
  data:
    - secretKey: password
      remoteRef:
        key: POSTGRES_PASSWORD
