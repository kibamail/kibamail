apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-marketing
  labels:
    app.kubernetes.io/name: kibamail-marketing
    app.kubernetes.io/component: marketing
    app.kubernetes.io/part-of: kibamail
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kibamail-marketing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibamail-marketing
        app.kubernetes.io/component: marketing
        app.kubernetes.io/part-of: kibamail
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kibamail-marketing
                topologyKey: kubernetes.io/hostname
      containers:
        - name: marketing
          image: ghcr.io/kibamail/kibamail-marketing:staging
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
