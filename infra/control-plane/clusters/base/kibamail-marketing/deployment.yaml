apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-marketing
  labels:
    app.kubernetes.io/name: kibamail-marketing
    app.kubernetes.io/component: marketing
    app.kubernetes.io/part-of: kibamail
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kibamail-marketing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibamail-marketing
        app.kubernetes.io/component: marketing
        app.kubernetes.io/part-of: kibamail
        service.name: kibamail-marketing
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kibamail-marketing
                topologyKey: kubernetes.io/hostname
      containers:
        - name: marketing
          image: ghcr.io/kibamail/kibamail-marketing:staging
          imagePullPolicy: Always
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: "kibamail-marketing"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=kibamail-marketing,deployment.environment=staging,host.name=$(NODE_NAME),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name=kibamail-marketing"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
