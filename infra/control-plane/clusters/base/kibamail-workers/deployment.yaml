apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-workers
  namespace: kibamail-workers
  labels:
    app.kubernetes.io/name: kibamail-workers
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: kibamail
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: kibamail-workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibamail-workers
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: kibamail
        service.name: kibamail-workers
      annotations:
        signoz.io/scrape: "true"
        signoz.io/port: "9090"
        signoz.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kibamail-workers
                topologyKey: kubernetes.io/hostname
      containers:
        - name: worker
          image: ghcr.io/kibamail/kibamail-worker:staging
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            # OTEL K8s metadata from downward API
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: "kibamail-workers"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=kibamail-workers,deployment.environment=staging,host.name=$(NODE_NAME),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name=kibamail-workers"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: METRICS_PORT
              value: "9090"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-postgres
                  key: DATABASE_URL
            - name: REDIS_HOST
              value: "kibamail-valkey.kibamail-valkey.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-plane-valkey
                  key: password
            - name: REDIS_DATABASE
              value: "0"
            - name: REDIS_CLUSTER_MODE
              value: "true"
            - name: LOGTO_TENANT_ID
              value: "default"
            - name: LOGTO_ENDPOINT
              value: "https://auth.staging.kibamail.com"
            - name: LOGTO_APP_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-logto
                  key: APP_ID
            - name: LOGTO_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-logto
                  key: APP_SECRET
            - name: LOGTO_BASE_URL
              value: "https://staging.kibamail.com"
            - name: LOGTO_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-credentials
                  key: LOGTO_COOKIE_SECRET
            - name: LOGTO_COOKIE_SECURE
              value: "true"
            - name: LOGTO_M2M_APP_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-logto
                  key: M2M_APP_ID
            - name: LOGTO_M2M_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-logto
                  key: M2M_APP_SECRET
            - name: OUTPOST_API_URL
              value: "http://outpost.outpost.svc.cluster.local:3333"
            - name: OUTPOST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-outpost
                  key: API_KEY
            - name: OUTPOST_API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-outpost
                  key: API_JWT_SECRET
            - name: OUTPOST_AES_ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-outpost
                  key: AES_ENCRYPTION_SECRET
            - name: OUTPOST_REDIS_HOST
              value: "kibamail-valkey.kibamail-valkey.svc.cluster.local"
            - name: OUTPOST_REDIS_PORT
              value: "6379"
            - name: OUTPOST_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-plane-valkey
                  key: password
            - name: OUTPOST_REDIS_DATABASE
              value: "1"
            - name: S3_PUBLIC_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-public
                  key: ENDPOINT
            - name: S3_PUBLIC_REGION
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-public
                  key: REGION
            - name: S3_PUBLIC_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-public
                  key: ACCESS_KEY_ID
            - name: S3_PUBLIC_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-public
                  key: SECRET_ACCESS_KEY
            - name: S3_PUBLIC_BUCKET
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-public
                  key: BUCKET
            - name: S3_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-public
                  key: PUBLIC_URL
            - name: S3_PRIVATE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-private
                  key: ENDPOINT
            - name: S3_PRIVATE_REGION
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-private
                  key: REGION
            - name: S3_PRIVATE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-private
                  key: ACCESS_KEY_ID
            - name: S3_PRIVATE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-private
                  key: SECRET_ACCESS_KEY
            - name: S3_PRIVATE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: control-plane-s3-private
                  key: BUCKET
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-credentials
                  key: APP_KEY
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-credentials
                  key: INTERNAL_SERVICE_KEY
            - name: OTEL_INGESTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-credentials
                  key: OTEL_INGESTION_API_KEY
            - name: ACME_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-credentials
                  key: ACME_ACCOUNT_KEY
            # MTA Direct Injection Configuration
            - name: MTA_INJECTION_URL
              valueFrom:
                configMapKeyRef:
                  name: kibamail-config
                  key: MTA_INJECTION_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
