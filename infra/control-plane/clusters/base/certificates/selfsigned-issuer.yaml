apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kibamail-ca-issuer
spec:
  ca:
    secretName: kibamail-ca-secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kibamail-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: kibamail-ca
  secretName: kibamail-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
