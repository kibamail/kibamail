apiVersion: apps/v1
kind: Deployment
metadata:
  name: outpost-api
  labels:
    app.kubernetes.io/name: outpost-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: kibamail
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outpost-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outpost-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: kibamail
        service.name: outpost-api
    spec:
      containers:
        - name: outpost-api
          image: hookdeck/outpost:v0.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3333
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name=outpost-api"
            - name: SERVICE
              value: api
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: outpost-credentials
                  key: API_KEY
            - name: API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: outpost-credentials
                  key: API_JWT_SECRET
            - name: AES_ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: outpost-credentials
                  key: AES_ENCRYPTION_SECRET
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: outpost-postgres
                  key: POSTGRES_URL
            - name: RABBITMQ_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: outpost-rabbitmq
                  key: RABBITMQ_SERVER_URL
            - name: REDIS_HOST
              value: "kibamail-valkey.kibamail-valkey.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outpost-valkey-password
                  key: password
            - name: REDIS_CLUSTER_ENABLED
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /config/outpost
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: outpost-config
