apiVersion: apps/v1
kind: Deployment
metadata:
  name: outpost-log
  labels:
    app.kubernetes.io/name: outpost-log
    app.kubernetes.io/component: log
    app.kubernetes.io/part-of: kibamail
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outpost-log
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outpost-log
        app.kubernetes.io/component: log
        app.kubernetes.io/part-of: kibamail
        service.name: outpost-log
    spec:
      containers:
        - name: outpost-log
          image: hookdeck/outpost:v0.7.0
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: "outpost-log"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=outpost-log,deployment.environment=staging,host.name=$(NODE_NAME),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name=outpost-log"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: SERVICE
              value: log
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: outpost-credentials
                  key: API_KEY
            - name: API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: outpost-credentials
                  key: API_JWT_SECRET
            - name: AES_ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: outpost-credentials
                  key: AES_ENCRYPTION_SECRET
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: outpost-postgres
                  key: POSTGRES_URL
            - name: RABBITMQ_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: outpost-rabbitmq
                  key: RABBITMQ_SERVER_URL
            - name: REDIS_HOST
              value: "kibamail-valkey.kibamail-valkey.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outpost-valkey-password
                  key: password
            - name: REDIS_CLUSTER_ENABLED
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /config/outpost
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: outpost-config
