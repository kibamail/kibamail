apiVersion: v1
kind: ConfigMap
metadata:
  name: outpost-config
  labels:
    app.kubernetes.io/name: outpost
    app.kubernetes.io/part-of: kibamail
data:
  config.yaml: |
    topics:
      # Email delivery events
      - email.delivered
      - email.bounced
      - email.soft_bounced
      - email.complained
      - email.rejected
      - email.failed
      - email.queued
      # Email engagement events
      - email.opened
      - email.clicked
      - email.unsubscribed
      - email.list_unsubscribed
      # Contact events
      - contact.created
      - contact.updated
      - contact.deleted
      - contact.subscribed
      - contact.unsubscribed
      - contact.status_changed
      - contact.topic_subscribed
      - contact.topic_unsubscribed
      - contact.tagged
      - contact.untagged
      # Topic events
      - topic.created
      - topic.updated
      - topic.deleted
      # Tag events
      - tag.created
      - tag.updated
      - tag.deleted
      # Broadcast events
      - broadcast.created
      - broadcast.updated
      - broadcast.scheduled
      - broadcast.sent
      - broadcast.paused
      - broadcast.cancelled
      - broadcast.failed
      # Transactional email events
      - transactional_email.sent
      - transactional_email.delivered
      - transactional_email.bounced
      - transactional_email.complained
      - transactional_email.opened
      - transactional_email.clicked
      # Segment events
      - segment.created
      - segment.updated
      - segment.deleted
      - segment.contact_entered
      - segment.contact_exited
      # Form events
      - form.created
      - form.updated
      - form.published
      - form.unpublished
      - form.submission
      - form.submission_verified
      - form.submission_spam
      # Automation events
      - automation.created
      - automation.updated
      - automation.published
      - automation.paused
      - automation.contact_entered
      - automation.contact_exited
      - automation.step_completed
      - automation.failed
      # Conversation events
      - conversation.created
      - conversation.message_received
      - conversation.message_sent
      - conversation.closed
      - conversation.archived
      # Domain events
      - domain.created
      - domain.verified
      - domain.verification_failed
      - domain.deleted
      # Suppression events
      - suppression.added
      - suppression.removed
      # API key events
      - api_key.created
      - api_key.revoked

    mqs:
      delivery_retry_limit: 10
      log_retry_limit: 10

    destinations:
      webhook:
        header_prefix: "x-kibamail-"
