apiVersion: apps/v1
kind: Deployment
metadata:
  name: outpost-delivery
  labels:
    app.kubernetes.io/name: outpost-delivery
    app.kubernetes.io/component: delivery
    app.kubernetes.io/part-of: kibamail
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outpost-delivery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outpost-delivery
        app.kubernetes.io/component: delivery
        app.kubernetes.io/part-of: kibamail
    spec:
      containers:
        - name: outpost-delivery
          image: hookdeck/outpost:v0.7.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE
              value: delivery
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: outpost-credentials
                  key: API_KEY
            - name: API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: outpost-credentials
                  key: API_JWT_SECRET
            - name: AES_ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: outpost-credentials
                  key: AES_ENCRYPTION_SECRET
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: outpost-postgres
                  key: POSTGRES_URL
            - name: RABBITMQ_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: outpost-rabbitmq
                  key: RABBITMQ_SERVER_URL
            - name: REDIS_HOST
              value: "kibamail-valkey.kibamail-valkey.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outpost-valkey-password
                  key: password
            - name: REDIS_CLUSTER_ENABLED
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /config/outpost
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: outpost-config
