apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-control-plane
  namespace: kibamail-control-plane
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: LOGTO_ENDPOINT
              value: "https://auth.kibamail.com"
            - name: LOGTO_BASE_URL
              value: "https://auth.kibamail.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-api
  namespace: kibamail-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: LOGTO_ENDPOINT
              value: "https://auth.kibamail.com"
            - name: LOGTO_BASE_URL
              value: "https://auth.kibamail.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-workers
  namespace: kibamail-workers
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: LOGTO_ENDPOINT
              value: "https://auth.kibamail.com"
            - name: LOGTO_BASE_URL
              value: "https://auth.kibamail.com"
