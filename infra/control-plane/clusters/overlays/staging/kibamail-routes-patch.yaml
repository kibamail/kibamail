# TLSRoute patches for staging hostnames
# Note: TLSRoutes use hostnames array, not single hostname like HTTPRoutes
# Staging uses subdomains (staging.kibamail.com) so all use tls-kibamail listener
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kibamail-apex
spec:
  parentRefs:
    - name: kibamail-gateway
      sectionName: tls-kibamail
  hostnames:
    - staging.kibamail.com
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kibamail-www
spec:
  hostnames:
    - www.staging.kibamail.com
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kibamail-api
spec:
  hostnames:
    - api.staging.kibamail.com
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kibamail-forms
spec:
  hostnames:
    - forms.staging.kibamail.com
---
# Tracking route - staging tracking domain
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kibamail-tracking
spec:
  hostnames:
    - staging.e.kbmta.net
