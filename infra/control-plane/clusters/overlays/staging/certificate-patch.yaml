# Certificate patch for kibamail namespace
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kibamail-tls
  namespace: kibamail
spec:
  dnsNames:
    - staging.kibamail.com
    - www.staging.kibamail.com
    - api.staging.kibamail.com
    - forms.staging.kibamail.com
---
# Certificate patch for logto namespace
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: logto-tls
  namespace: logto
spec:
  dnsNames:
    - auth.staging.kibamail.com
    - admin.auth.staging.kibamail.com
---
# Certificate patch for tracking namespace
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tracking-tls
  namespace: kibamail-tracking
spec:
  dnsNames:
    - staging.e.kbmta.net
