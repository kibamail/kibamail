apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-control-plane
  namespace: kibamail-control-plane
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: LOGTO_ENDPOINT
              value: "https://auth.staging.kibamail.com"
            - name: LOGTO_BASE_URL
              value: "https://staging.kibamail.com"
            # Disable OTel in staging
            - name: OTEL_SDK_DISABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-api
  namespace: kibamail-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: LOGTO_ENDPOINT
              value: "https://auth.staging.kibamail.com"
            - name: LOGTO_BASE_URL
              value: "https://staging.kibamail.com"
            # Disable OTel in staging
            - name: OTEL_SDK_DISABLED
