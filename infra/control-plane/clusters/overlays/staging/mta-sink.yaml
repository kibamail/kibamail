apiVersion: apps/v1
kind: Deployment
metadata:
  name: mta-sink
  namespace: kibamail
  labels:
    app.kubernetes.io/name: mta-sink
    app.kubernetes.io/component: mta
    app.kubernetes.io/part-of: kibamail
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mta-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mta-sink
        app.kubernetes.io/component: mta
        app.kubernetes.io/part-of: kibamail
    spec:
      containers:
        - name: mta-sink
          image: ghcr.io/kibamail/kibamail-mta-sink:staging
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mta-sink
  namespace: kibamail
  labels:
    app.kubernetes.io/name: mta-sink
    app.kubernetes.io/component: mta
    app.kubernetes.io/part-of: kibamail
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: mta-sink
