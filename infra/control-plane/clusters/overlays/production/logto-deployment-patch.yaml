apiVersion: apps/v1
kind: Deployment
metadata:
  name: logto
spec:
  template:
    spec:
      containers:
        - name: logto
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: "logto"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=logto,deployment.environment=production,host.name=$(NODE_NAME),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name=logto"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: ENDPOINT
              value: "https://auth.kibamail.com"
            - name: ADMIN_ENDPOINT
              value: "https://admin.auth.kibamail.com"
