apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-control-plane
  namespace: kibamail-control-plane
spec:
  template:
    spec:
      initContainers:
        - name: migrations
          image: ghcr.io/kibamail/kibamail:prod-cli
      containers:
        - name: web
          image: ghcr.io/kibamail/kibamail:prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-marketing
  namespace: kibamail-marketing
spec:
  template:
    spec:
      containers:
        - name: marketing
          image: ghcr.io/kibamail/kibamail-marketing:prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-api
  namespace: kibamail-api
spec:
  template:
    spec:
      containers:
        - name: api
          image: ghcr.io/kibamail/kibamail:prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-workers
  namespace: kibamail-workers
spec:
  template:
    spec:
      containers:
        - name: worker
          image: ghcr.io/kibamail/kibamail-worker:prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibamail-event-ingestor
  namespace: kibamail-event-ingestor
spec:
  template:
    spec:
      containers:
        - name: event-ingestor
          image: ghcr.io/kibamail/kibamail-event-ingestor:prod
