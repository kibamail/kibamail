# TLSRoute patches for production hostnames
# Note: TLSRoutes use hostnames array, not single hostname like HTTPRoutes
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kibamail-apex
spec:
  hostnames:
    - kibamail.com
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kibamail-www
spec:
  hostnames:
    - www.kibamail.com
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: kibamail-api
spec:
  hostnames:
    - api.kibamail.com
