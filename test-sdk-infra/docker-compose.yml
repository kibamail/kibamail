services:
  prism:
    image: stoplight/prism:4
    container_name: kibamail-test-sdk-prism
    command: mock -h 0.0.0.0 /openapi.json
    ports:
      - "4010:4010"
    volumes:
      - ../apps/web/public/openapi.v1.json:/openapi.json:ro
    environment:
      - PRISM_DYNAMIC=true
      - PRISM_CORS=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4010"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
