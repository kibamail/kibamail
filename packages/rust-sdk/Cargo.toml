[package]
name = "kibamail"
version = "0.0.1-alpha.0"
edition = "2021"
rust-version = "1.70"

license = "MIT"
readme = "./README.md"
authors = ["Kibamail Team <hello@kibamail.com>"]
repository = "https://github.com/kibamail/kibamail-rust"
homepage = "https://kibamail.com/docs"
documentation = "https://docs.rs/kibamail"

categories = ["email", "web-programming", "api-bindings"]
keywords = ["email", "kibamail", "marketing", "api", "sdk"]
description = "Official Rust SDK for the Kibamail API"

[features]
default = ["native-tls"]

blocking = ["reqwest/blocking", "maybe-async/is_sync"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls-tls"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
maybe-async = "0.2.10"

[dev-dependencies]
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }
