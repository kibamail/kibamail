name: test node.js sdk

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test on node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: start test infrastructure (prism)
        working-directory: test-sdk-infra
        run: |
          docker compose up -d
          echo "Waiting for Prism to start..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4010/v1/api-keys -H "Authorization: Bearer test" > /dev/null 2>&1; then
              echo "Prism is ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "Prism failed to start. Logs:"
          docker logs kibamail-test-sdk-prism
          exit 1

      - name: run tests
        run: pnpm --filter kibamail test

      - name: stop test infrastructure
        if: always()
        working-directory: test-sdk-infra
        run: docker compose down
