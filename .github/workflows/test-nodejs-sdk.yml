name: test node.js sdk

on:
  push:
    branches: [main, develop]
    paths:
      - "sdks/nodejs/**"
      - "test-sdk-infra/**"
      - "apps/web/public/openapi.v1.json"
      - ".github/workflows/test-nodejs-sdk.yml"
  pull_request:
    paths:
      - "sdks/nodejs/**"
      - "test-sdk-infra/**"
      - "apps/web/public/openapi.v1.json"
      - ".github/workflows/test-nodejs-sdk.yml"

jobs:
  test:
    name: test on node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: start test infrastructure (prism)
        working-directory: test-sdk-infra
        run: |
          docker compose up -d
          # Wait for Prism to be ready
          timeout 30 bash -c 'until curl -s http://localhost:4010 > /dev/null; do sleep 1; done'
          echo "Prism is ready"

      - name: run tests
        run: pnpm --filter kibamail test

      - name: stop test infrastructure
        if: always()
        working-directory: test-sdk-infra
        run: docker compose down
