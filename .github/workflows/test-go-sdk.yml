name: test go sdk

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  test:
    name: test on go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: sdks/go/go.sum

      - name: install dependencies
        working-directory: sdks/go
        run: go mod download

      - name: start test infrastructure (prism)
        working-directory: test-sdk-infra
        run: |
          docker compose up -d
          # Wait for Prism to be ready
          timeout 60 bash -c 'until curl -s http://localhost:4010 > /dev/null; do sleep 1; done'
          echo "Prism is ready"

      - name: run tests
        working-directory: sdks/go
        run: go test -v -race ./...

      - name: stop test infrastructure
        if: always()
        working-directory: test-sdk-infra
        run: docker compose down
