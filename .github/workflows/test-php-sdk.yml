name: test php sdk

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test on php ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4"]

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, curl
          tools: composer:v2

      - name: get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: install dependencies
        working-directory: sdks/php
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: start test infrastructure (prism)
        working-directory: test-sdk-infra
        run: |
          docker compose up -d
          echo "Waiting for Prism to start..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4010/v1/api-keys -H "Authorization: Bearer test" > /dev/null 2>&1; then
              echo "Prism is ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "Prism failed to start. Logs:"
          docker logs kibamail-test-sdk-prism
          exit 1

      - name: run tests
        working-directory: sdks/php
        run: vendor/bin/pest --colors=always

      - name: stop test infrastructure
        if: always()
        working-directory: test-sdk-infra
        run: docker compose down
