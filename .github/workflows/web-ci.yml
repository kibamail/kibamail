name: web ci/cd

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kibamail
  WORKER_IMAGE_NAME: ${{ github.repository_owner }}/kibamail-worker
  TRACKING_IMAGE_NAME: ${{ github.repository_owner }}/kibamail-tracking
  TRACKING_TLS_IMAGE_NAME: ${{ github.repository_owner }}/kibamail-tracking-tls

jobs:
  test:
    name: test
    runs-on: depot-ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: start services with docker compose
        working-directory: apps/web
        run: |
          docker compose -f docker-compose.ci.yml up --wait
          # Start MTA environment (minio-init exits after creating buckets, so we can't use --wait)
          docker compose -f compose.kumomta.yaml up -d
          # Wait for core services to be healthy
          echo "Waiting for MTA services to be healthy..."
          timeout 120 bash -c 'until docker compose -f compose.kumomta.yaml ps kumomta | grep -q "healthy"; do sleep 2; done'
          timeout 60 bash -c 'until docker compose -f compose.kumomta.yaml ps mailpit | grep -q "healthy"; do sleep 2; done'
          echo "MTA services are healthy"

      - name: build shared packages
        run: |
          pnpm --filter @repo/tracking-utils build
          cd packages/owly && pnpm build:clean && pnpm build:css && pnpm build:components
          pnpm --filter @repo/broadcast-editor build

      - name: generate prisma client
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/kibamail_test
        run: pnpm exec prisma generate

      - name: run database migrations
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/kibamail_test
        run: pnpm exec prisma migrate deploy

      - name: run tests
        working-directory: apps/web
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/kibamail_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          REDIS_DATABASE: 0
          LOGTO_TENANT_ID: default
          LOGTO_ENDPOINT: http://localhost:3001
          LOGTO_APP_ID: test-app-id
          LOGTO_APP_SECRET: test-app-secret
          LOGTO_BASE_URL: http://localhost:18092
          LOGTO_COOKIE_SECRET: Tl9WvRqMSYz69IXfonKJLLfy1uWJA4eJ
          LOGTO_COOKIE_SECURE: "false"
          LOGTO_M2M_APP_ID: test-m2m-app-id
          LOGTO_M2M_APP_SECRET: test-m2m-app-secret
          OUTPOST_API_URL: http://localhost:3333
          OUTPOST_API_KEY: test-api-key
          OUTPOST_API_JWT_SECRET: test-jwt-secret
          OUTPOST_AES_ENCRYPTION_SECRET: test-aes-secret
          OUTPOST_REDIS_HOST: localhost
          OUTPOST_REDIS_PORT: 6379
          OUTPOST_REDIS_PASSWORD: ""
          OUTPOST_REDIS_DATABASE: 1
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: test-access-key
          S3_SECRET_ACCESS_KEY: test-secret-key
          S3_BUCKET: test-bucket
          S3_PUBLIC_URL: http://localhost:9000/test-bucket
          APP_KEY: TestAppKeyForDevelopmentOnly32ch
          INTERNAL_SERVICE_KEY: TestServiceKeyForDevelopment32
          MTA_INJECTION_URL: http://localhost:8000
          MAILPIT_URL: http://localhost:8025
        run: pnpm test

  build-runner:
    name: build web image
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: get image tag for deployment
        id: get-tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

  build-cli:
    name: build cli image
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=-cli
            type=raw,value=staging-cli,enable=${{ github.ref == 'refs/heads/main' }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: cli
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: get image tag for deployment
        id: get-tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

  build-worker:
    name: build worker image
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging-worker,enable=${{ github.ref == 'refs/heads/main' }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.worker
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: get image tag for deployment
        id: get-tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

  build-tracking:
    name: build tracking image
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.TRACKING_IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/tracking/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: get image tag for deployment
        id: get-tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

  build-tracking-tls:
    name: build tracking tls image
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.TRACKING_TLS_IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/tracking/openresty
          file: apps/tracking/openresty/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: get image tag for deployment
        id: get-tag
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

  deploy-staging:
    name: deploy to staging
    needs: [test, build-runner, build-cli, build-worker, build-tracking, build-tracking-tls]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04
    environment: staging

    steps:
      - name: set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: deploy web to kubernetes
        run: |
          kubectl set image deployment/kibamail-web \
            -n kibamail \
            control-plane=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-runner.outputs.image-tag }}

      - name: patch migrations initcontainer in web deployment
        run: |
          kubectl patch deployment kibamail-web \
            -n kibamail \
            --type=json \
            -p='[
              {
                "op": "replace",
                "path": "/spec/template/spec/initContainers/1/image",
                "value": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-cli"
              }
            ]'

      - name: deploy workers to kubernetes
        run: |
          kubectl set image deployment/kibamail-workers \
            -n kibamail-workers \
            worker=${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:${{ needs.build-worker.outputs.image-tag }}

      - name: deploy tracking to kubernetes
        run: |
          kubectl set image deployment/kibamail-tracking \
            -n kibamail-tracking \
            tracking=${{ env.REGISTRY }}/${{ env.TRACKING_IMAGE_NAME }}:${{ needs.build-tracking.outputs.image-tag }} \
            openresty=${{ env.REGISTRY }}/${{ env.TRACKING_TLS_IMAGE_NAME }}:${{ needs.build-tracking-tls.outputs.image-tag }}

      - name: wait for web rollout
        run: |
          kubectl rollout status deployment/kibamail-web \
            -n kibamail \
            --timeout=600s

      - name: wait for workers rollout
        run: |
          kubectl rollout status deployment/kibamail-workers \
            -n kibamail-workers \
            --timeout=300s

      - name: wait for tracking rollout
        run: |
          kubectl rollout status deployment/kibamail-tracking \
            -n kibamail-tracking \
            --timeout=300s
