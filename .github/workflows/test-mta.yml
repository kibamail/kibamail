name: test-mta

# =============================================================================
# MTA Integration Test Workflow
# =============================================================================
#
# Runs comprehensive KumoMTA integration tests using Docker Compose.
# Tests email delivery pipeline, bounce processing, and DMARC reports.
#
# Triggers:
#   - Push to main branch
#   - Pull requests with changes to apps/mta/**
#
# =============================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ["apps/mta/**"]

# Allow only one concurrent run per branch to avoid resource conflicts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-mta:
    name: MTA Integration Tests
    runs-on: ubuntu-latest

    timeout-minutes: 20

    strategy:
      matrix:
        go-version: ["1.21"]

    env:
      INTEGRATION_TEST: 1

      COMPOSE_PROJECT_NAME: mta-tests-${{ github.run_id }}

    steps:
      # =============================================================================
      # Environment Setup
      # =============================================================================

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: apps/mta/tests/go.sum

      - name: Verify Docker and Docker Compose
        run: |
          docker --version
          docker compose version

      - name: Free up disk space
        run: |
          # Remove unused Docker images and containers
          docker system prune -af --volumes || true
          # Clear some system files to free space
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc
          echo "Available disk space:"
          df -h

      # =============================================================================
      # Certificate Generation
      # =============================================================================

      - name: Generate test certificates
        run: |
          cd apps/mta/tests
          echo "Generating TLS and DKIM certificates..."
          if [[ -x "./certs/generate-certs.sh" ]]; then
            ./certs/generate-certs.sh
          elif [[ -x "./scripts/setup.sh" ]]; then
            ./scripts/setup.sh
          else
            echo "ERROR: Certificate generation script not found"
            exit 1
          fi

          echo "Generated certificates:"
          ls -la certs/

      # =============================================================================
      # Test Execution
      # =============================================================================

      - name: Run MTA integration tests
        run: |
          cd apps/mta/tests

          echo "Starting MTA integration test suite..."
          echo "Available memory:"
          free -h
          echo "Available disk space:"
          df -h

          # Run tests with timeout to prevent hanging
          timeout 15m ./run-tests.sh || {
            echo "Tests failed or timed out"
            # Collect logs before cleanup
            echo "=== Docker Container Logs ==="
            docker compose logs --no-color || true
            echo "=== Container Status ==="
            docker compose ps || true
            exit 1
          }

      # =============================================================================
      # Debugging Information (on failure)
      # =============================================================================

      - name: Collect test artifacts
        if: failure() || cancelled()
        run: |
          cd apps/mta/tests

          echo "Collecting debugging information..."

          # Create debug directory
          mkdir -p debug-logs

          # Collect Docker logs
          echo "=== Collecting Docker logs ==="
          docker compose logs --no-color > debug-logs/docker-compose.log 2>&1 || true

          # Collect container status
          echo "=== Container status ==="
          docker compose ps > debug-logs/container-status.log 2>&1 || true

          # Collect network info
          echo "=== Network information ==="
          docker network ls > debug-logs/networks.log 2>&1 || true
          ip addr show > debug-logs/ip-addr.log 2>&1 || true

          # Collect system resources
          echo "=== System resources ==="
          free -h > debug-logs/memory.log 2>&1 || true
          df -h > debug-logs/disk.log 2>&1 || true
          ps aux > debug-logs/processes.log 2>&1 || true

          # Check if control plane mock is still running
          if [[ -f "/tmp/controlplane-mock.pid" ]]; then
            cat /tmp/controlplane.log > debug-logs/control-plane.log 2>&1 || true
          fi

          echo "Debug logs collected:"
          ls -la debug-logs/

      - name: Upload debug artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: mta-test-debug-logs-${{ github.run_number }}
          path: apps/mta/tests/debug-logs/
          retention-days: 7

      # =============================================================================
      # Cleanup
      # =============================================================================

      - name: Cleanup test environment
        if: always()
        run: |
          cd apps/mta/tests

          echo "Cleaning up test environment..."

          # Force cleanup using the script
          ./run-tests.sh --teardown || true

          # Additional cleanup to ensure no orphaned containers
          docker compose down --remove-orphans -v || true

          # Kill any remaining control plane mock processes
          if [[ -f "/tmp/controlplane-mock.pid" ]]; then
            pkill -f "controlplane-mock" || true
            rm -f "/tmp/controlplane-mock.pid" || true
          fi

          # Clean up temporary files
          rm -f /tmp/controlplane.log || true
          rm -f /tmp/controlplane-mock || true

          # Remove Docker images to free space for next run
          docker image prune -af || true

          echo "Cleanup complete"

      - name: Verify cleanup
        if: always()
        run: |
          echo "Verifying no containers remain..."
          docker ps -a --filter "name=kbmta-" --format "table {{.Names}}\t{{.Status}}" || echo "No MTA containers found"

          echo "Checking for remaining processes..."
          pgrep -f "controlplane-mock" && echo "WARNING: control-plane mock still running" || echo "No orphaned processes found"
