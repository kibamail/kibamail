name: deploy to production

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ${{ github.repository_owner }}/kibamail
  MARKETING_IMAGE: ${{ github.repository_owner }}/kibamail-marketing
  WORKER_IMAGE: ${{ github.repository_owner }}/kibamail-worker
  TRACKING_IMAGE: ${{ github.repository_owner }}/kibamail-tracking
  TRACKING_TLS_IMAGE: ${{ github.repository_owner }}/kibamail-tracking-tls

jobs:
  build-web:
    name: build web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: get image tag
        id: get-tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build-cli:
    name: build cli image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},suffix=-cli
            type=raw,value=prod-cli

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: cli
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: get image tag
        id: get-tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build-marketing:
    name: build marketing image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MARKETING_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/marketing/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: get image tag
        id: get-tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build-worker:
    name: build worker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: get image tag
        id: get-tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build-tracking:
    name: build tracking image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.TRACKING_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/tracking/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: get image tag
        id: get-tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build-tracking-tls:
    name: build tracking tls image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.TRACKING_TLS_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/tracking/openresty
          file: apps/tracking/openresty/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: get image tag
        id: get-tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  deploy:
    name: deploy to production
    needs: [build-web, build-cli, build-marketing, build-worker, build-tracking, build-tracking-tls]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: deploy web to kubernetes
        run: |
          kubectl set image deployment/kibamail-web \
            -n kibamail \
            control-plane=${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ needs.build-web.outputs.image-tag }}

      - name: patch initcontainers in web deployment
        run: |
          kubectl patch deployment kibamail-web \
            -n kibamail \
            --type=strategic \
            -p='{
              "spec": {
                "template": {
                  "spec": {
                    "initContainers": [
                      {
                        "name": "marketing-init",
                        "image": "${{ env.REGISTRY }}/${{ env.MARKETING_IMAGE }}:${{ needs.build-marketing.outputs.image-tag }}"
                      },
                      {
                        "name": "migrations",
                        "image": "${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ needs.build-cli.outputs.image-tag }}-cli"
                      }
                    ]
                  }
                }
              }
            }'

      - name: deploy workers to kubernetes
        run: |
          kubectl set image deployment/kibamail-workers \
            -n kibamail-workers \
            worker=${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:${{ needs.build-worker.outputs.image-tag }}

      - name: deploy tracking to kubernetes
        run: |
          kubectl set image deployment/kibamail-tracking \
            -n kibamail-tracking \
            tracking=${{ env.REGISTRY }}/${{ env.TRACKING_IMAGE }}:${{ needs.build-tracking.outputs.image-tag }} \
            openresty=${{ env.REGISTRY }}/${{ env.TRACKING_TLS_IMAGE }}:${{ needs.build-tracking-tls.outputs.image-tag }}

      - name: wait for web rollout
        run: |
          kubectl rollout status deployment/kibamail-web \
            -n kibamail \
            --timeout=600s

      - name: wait for workers rollout
        run: |
          kubectl rollout status deployment/kibamail-workers \
            -n kibamail-workers \
            --timeout=300s

      - name: wait for tracking rollout
        run: |
          kubectl rollout status deployment/kibamail-tracking \
            -n kibamail-tracking \
            --timeout=300s
