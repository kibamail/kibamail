name: Deploy to Production

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ${{ github.repository_owner }}/kibamail
  MARKETING_IMAGE: ${{ github.repository_owner }}/kibamail-marketing

jobs:
  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image tag
        id: get-tag
        run: echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT

  build-marketing:
    name: Build Marketing Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MARKETING_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/marketing/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image tag
        id: get-tag
        run: echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Production
    needs: [build-web, build-marketing]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy Web to Kubernetes
        run: |
          kubectl set image deployment/kibamail-control-plane \
            -n kibamail-control-plane \
            web=${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ needs.build-web.outputs.image-tag }}

      - name: Deploy Marketing to Kubernetes
        run: |
          kubectl set image deployment/kibamail-marketing \
            -n kibamail-marketing \
            marketing=${{ env.REGISTRY }}/${{ env.MARKETING_IMAGE }}:${{ needs.build-marketing.outputs.image-tag }}

      - name: Deploy API to Kubernetes
        run: |
          kubectl set image deployment/kibamail-api \
            -n kibamail-api \
            api=${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ needs.build-web.outputs.image-tag }}

      - name: Wait for Web rollout
        run: |
          kubectl rollout status deployment/kibamail-control-plane \
            -n kibamail-control-plane \
            --timeout=300s

      - name: Wait for Marketing rollout
        run: |
          kubectl rollout status deployment/kibamail-marketing \
            -n kibamail-marketing \
            --timeout=300s

      - name: Wait for API rollout
        run: |
          kubectl rollout status deployment/kibamail-api \
            -n kibamail-api \
            --timeout=300s
