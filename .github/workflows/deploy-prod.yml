name: Deploy to Production

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ${{ github.repository_owner }}/kibamail
  MARKETING_IMAGE: ${{ github.repository_owner }}/kibamail-marketing
  WORKER_IMAGE: ${{ github.repository_owner }}/kibamail-worker
  EVENT_INGESTOR_IMAGE: ${{ github.repository_owner }}/kibamail-event-ingestor
  TRACKING_IMAGE: ${{ github.repository_owner }}/kibamail-tracking

jobs:
  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod

      - name: Build and push (production runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image tag
        id: get-tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build-cli:
    name: Build CLI Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},suffix=-cli
            type=raw,value=prod-cli

      - name: Build and push (CLI stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: cli
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image tag
        id: get-tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build-marketing:
    name: Build Marketing Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MARKETING_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/marketing/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image tag
        id: get-tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build-worker:
    name: Build Worker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod

      - name: Build and push (worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image tag
        id: get-tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build-event-ingestor:
    name: Build Event Ingestor Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.EVENT_INGESTOR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod

      - name: Build and push (event-ingestor)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.event-ingestor
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image tag
        id: get-tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build-tracking:
    name: Build Tracking Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.TRACKING_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=prod

      - name: Build and push (tracking)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/tracking/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image tag
        id: get-tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Production
    needs: [build-web, build-cli, build-marketing, build-worker, build-event-ingestor, build-tracking]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy Web to Kubernetes
        run: |
          kubectl set image deployment/kibamail-control-plane \
            -n kibamail-control-plane \
            web=${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ needs.build-web.outputs.image-tag }}

      - name: Patch initContainers in Web deployment
        run: |
          kubectl patch deployment kibamail-control-plane \
            -n kibamail-control-plane \
            --type=json \
            -p='[
              {
                "op": "replace",
                "path": "/spec/template/spec/initContainers/0/image",
                "value": "${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:prod-cli"
              }
            ]'

      - name: Deploy Marketing to Kubernetes
        run: |
          kubectl set image deployment/kibamail-marketing \
            -n kibamail-marketing \
            marketing=${{ env.REGISTRY }}/${{ env.MARKETING_IMAGE }}:${{ needs.build-marketing.outputs.image-tag }}

      - name: Deploy API to Kubernetes
        run: |
          kubectl set image deployment/kibamail-api \
            -n kibamail-api \
            api=${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ needs.build-web.outputs.image-tag }}

      - name: Deploy Workers to Kubernetes
        run: |
          kubectl set image deployment/kibamail-workers \
            -n kibamail-workers \
            worker=${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:${{ needs.build-worker.outputs.image-tag }}

      - name: Deploy Event Ingestor to Kubernetes
        run: |
          kubectl set image deployment/kibamail-event-ingestor \
            -n kibamail-event-ingestor \
            event-ingestor=${{ env.REGISTRY }}/${{ env.EVENT_INGESTOR_IMAGE }}:${{ needs.build-event-ingestor.outputs.image-tag }}

      - name: Deploy Tracking to Kubernetes
        run: |
          kubectl set image deployment/kibamail-tracking \
            -n kibamail-tracking \
            tracking=${{ env.REGISTRY }}/${{ env.TRACKING_IMAGE }}:${{ needs.build-tracking.outputs.image-tag }}

      - name: Wait for Web rollout
        run: |
          kubectl rollout status deployment/kibamail-control-plane \
            -n kibamail-control-plane \
            --timeout=300s

      - name: Wait for Marketing rollout
        run: |
          kubectl rollout status deployment/kibamail-marketing \
            -n kibamail-marketing \
            --timeout=300s

      - name: Wait for API rollout
        run: |
          kubectl rollout status deployment/kibamail-api \
            -n kibamail-api \
            --timeout=300s

      - name: Wait for Workers rollout
        run: |
          kubectl rollout status deployment/kibamail-workers \
            -n kibamail-workers \
            --timeout=300s

      - name: Wait for Event Ingestor rollout
        run: |
          kubectl rollout status deployment/kibamail-event-ingestor \
            -n kibamail-event-ingestor \
            --timeout=300s

      - name: Wait for Tracking rollout
        run: |
          kubectl rollout status deployment/kibamail-tracking \
            -n kibamail-tracking \
            --timeout=300s
