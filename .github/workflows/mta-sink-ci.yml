name: mta-sink ci/cd

on:
  push:
    branches:
      - main
    paths:
      - apps/mta-sink/**
  pull_request:
    branches: [main]
    paths:
      - apps/mta-sink/**

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kibamail-mta-sink

jobs:
  build:
    name: build mta-sink image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mta-sink/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: deploy to staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: deploy mta-sink to kubernetes
        run: |
          kubectl set image deployment/mta-sink \
            -n kibamail \
            mta-sink=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

      - name: wait for mta-sink rollout
        run: |
          kubectl rollout status deployment/mta-sink \
            -n kibamail \
            --timeout=120s
